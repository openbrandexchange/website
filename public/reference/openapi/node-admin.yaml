      responses:
        "200":
          description: Tokens (secrets never returned).
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/IngestToken"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags:
        - Automation
      operationId: createIngestToken
      summary: Create an ingest token (shown once)
      parameters:
        - $ref: "#/components/parameters/Csrf"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
