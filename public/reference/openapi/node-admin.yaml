openapi: 3.1.0
info:
  title: OBX Node Admin + Portal API
  version: 0.1.0
  summary: The API between the shared admin-ui and a node (brand admin + retailer portal).
  description: |
    **Non-normative.** Not part of the OBX standard; it is the contract between the shared
    `admin-ui` (a static single-page app) and the reference nodes (node-go, node-php,
    node-ts), so one UI works on every node. Other OBX implementations are free to build their
    own UI.

    **Serving.** A node serves the admin-ui build at `/` with single-page-app fallback: any
    GET that is not under `/admin/api`, `/obx/` or `/.well-known/` and accepts `text/html`
    returns `index.html`. UI routes that the node itself links to (e-mails):
    `/invite/{token}`, `/reset-password/{token}`, `/request-access`, `/login`.
    The node's public base URL comes from its configuration (`OBX_PUBLIC_URL`).

    **Sessions.** Cookie `obx_session` (HttpOnly, Secure except on http://localhost,
    SameSite=Lax, Path=/), sliding expiry, at most 30 days, invalidated on logout, password
    change and blocking. Bearer tokens are NOT accepted here.

    **CSRF.** Every POST/PUT/PATCH/DELETE under `/admin/api` MUST carry header
    `X-CSRF-Token` equal to the `csrf_token` returned by `GET /admin/api/session` (which works
    without being logged in and sets the matching HttpOnly cookie `obx_csrf`), else 403
    `csrf_failed`. Login rotates the token (use the one in the login response).

    **Roles.** `admin` (the brand) and `retailer`. `/admin/api/portal/*` is for retailers;
    admins may call it too and get a preview of everything published (their downloads are
    not logged). Everything else except public/session/setup/password/invite endpoints
    requires `admin`. Before first-run setup every other endpoint answers 409
    `setup_required`.

    **Catalog writes.** `/admin/api/catalog/*` has exactly the semantics of the OBX Ingest API
    (same bodies, results, errors, change-feed effects), just with session auth.

    **Errors.** `application/problem+json` with `obx_error` (docs/protocol.md#errors).
    Lists use `limit` + opaque `cursor` and return `{items, next_cursor}`.
  license:
    name: CC-BY-4.0
    url: https://creativecommons.org/licenses/by/4.0/
servers:
  - url: https://{host}
    variables:
      host:
        default: brand.example.org
security:
  - session: []
tags:
  - name: Session
    description: Login, logout, CSRF, password reset, invites.
  - name: Setup
    description: First-run wizard.
  - name: Settings
    description: Brand profile, branding and defaults.
  - name: Catalog
    description: Brand-side catalog management (ingest semantics).
  - name: Imports
    description: Uploads and scheduled pull imports.
  - name: Retailers
    description: Retailers, access requests, accounts and API clients.
  - name: Automation
    description: Ingest tokens and webhooks for the brand's own systems.
  - name: Stats
    description: Downloads and usage.
  - name: Portal
    description: The retailer portal.
paths:
  /admin/api/public/branding:
    get:
      tags:
        - Session
      operationId: getPublicBranding
      summary: Branding for the login and request-access pages
      security: []
      responses:
        "200":
          description: Public branding.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicBranding"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /admin/api/setup:
    get:
      tags:
        - Setup
      operationId: getSetupState
      summary: Is first-run setup still required?
      security: []
      responses:
        "200":
          description: Setup state.
          content:
            application/json:
              schema:
                type: object
                required:
                  - required
                properties:
                  required:
                    type: boolean
        "429":
          $ref: "#/components/responses/TooManyRequests"
    post:
      tags:
        - Setup
      operationId: completeSetup
      summary: Complete the first-run wizard
      description: |
        Creates the brand profile, the first brand and the first admin (password chosen here;
        there is never a default password) and logs in. Requires the one-time `setup_code`
        that the node prints in its log on first start (or that the operator preset with
        `OBX_SETUP_CODE`), so nobody else can claim a freshly deployed node. Rate limited
        (10 per 15 min per IP). 409 `setup_completed` once done.
      security: []
      parameters:
        - $ref: "#/components/parameters/Csrf"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetupInput"
      responses:
        "201":
          description: Done; session cookie set.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /admin/api/session:
    get:
      tags:
        - Session
      operationId: getSession
      summary: Current session (also when logged out) and CSRF token
      security: []
      responses:
        "200":
          description: Session state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /admin/api/session/login:
    post:
      tags:
        - Session
      operationId: login
      summary: Log in with e-mail and password
      description: 401 `invalid_credentials` (same answer for unknown e-mail), 403 `account_blocked`. Rate limited per IP and per e-mail (10 per 15 min).
      security: []
      parameters:
        - $ref: "#/components/parameters/Csrf"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  $ref: "#/components/schemas/Email"
                password:
                  type: string
                  maxLength: 200
      responses:
        "200":
          description: Logged in; cookie set.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /admin/api/session/logout:
    post:
      tags:
        - Session
      operationId: logout
      summary: Log out
      parameters:
        - $ref: "#/components/parameters/Csrf"
      responses:
        "204":
          description: Logged out.
        "403":
          $ref: "#/components/responses/Forbidden"
  /admin/api/password/forgot:
    post:
      tags:
        - Session
      operationId: forgotPassword
      summary: Send a reset link
      description: Always 202 (no account enumeration). Link `<public_url>/reset-password/<token>`, valid 1 hour, one-time. Rate limited (5 per 15 min per IP).
      security: []
      parameters:
        - $ref: "#/components/parameters/Csrf"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  $ref: "#/components/schemas/Email"
      responses:
        "202":
          description: Accepted.
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /admin/api/password/reset:
    post:
      tags:
        - Session
      operationId: resetPassword
      summary: Set a new password with a reset token
      security: []
      parameters:
        - $ref: "#/components/parameters/Csrf"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
                - password
              properties:
                token:
                  type: string
                  minLength: 20
                  maxLength: 200
                password:
                  $ref: "#/components/schemas/Password"
      responses:
        "200":
          description: Password set; logged in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          $ref: "#/components/responses/InviteInvalid"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /admin/api/invites/{token}:
    get:
      tags:
        - Session
      operationId: getInvite
      summary: Look up an invitation
      security: []
      parameters:
        - $ref: "#/components/parameters/TokenPath"
      responses:
        "200":
          description: Invitation details.
          content:
            application/json:
              schema:
                type: object
                required:
                  - email
                  - role
                  - expires_at
                properties:
                  email:
                    $ref: "#/components/schemas/Email"
                  name:
                    type:
                      - string
                      - "null"
                  role:
                    type: string
                    enum:
                      - admin
                      - retailer
                  retailer_name:
                    type:
                      - string
                      - "null"
                  expires_at:
                    $ref: "#/components/schemas/DateTime"
        "400":
          $ref: "#/components/responses/InviteInvalid"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /admin/api/invites/{token}/accept:
    post:
      tags:
        - Session
      operationId: acceptInvite
      summary: Accept an invitation by choosing a password
      description: One-time (the token is consumed atomically), valid 7 days. Logs in.
      security: []
      parameters:
        - $ref: "#/components/parameters/TokenPath"
        - $ref: "#/components/parameters/Csrf"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - password
              properties:
                name:
                  type: string
                  maxLength: 200
                password:
                  $ref: "#/components/schemas/Password"
                language:
                  $ref: "#/components/schemas/LanguageTag"
      responses:
        "200":
          description: Account active; logged in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          $ref: "#/components/responses/InviteInvalid"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /admin/api/me:
    patch:
      tags:
        - Session
      operationId: updateMe
      summary: Update own name, language or password
      description: Changing the password requires `current_password` and ends all other sessions.
      parameters:
        - $ref: "#/components/parameters/Csrf"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 200
                language:
                  $ref: "#/components/schemas/LanguageTag"
                current_password:
                  type: string
                  maxLength: 200
                new_password:
                  $ref: "#/components/schemas/Password"
      responses:
        "200":
          description: Updated session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /admin/api/settings:
    get:
      tags:
        - Settings
      operationId: getSettings
      summary: Node settings
      responses:
        "200":
          description: Settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    patch:
      tags:
        - Settings
      operationId: updateSettings
      summary: Update settings (JSON merge patch of the writable parts)
      description: Changing `portal.allow_original_download` or default rights affects what retailers see and is reflected in /changes (grant entries with resync, or asset upserts).
      parameters:
        - $ref: "#/components/parameters/Csrf"
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: "#/components/schemas/Settings"
      responses:
        "200":
          description: Updated settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /admin/api/settings/logo:
    put:
      tags:
        - Settings
      operationId: uploadLogo
      summary: Upload the portal logo (PNG, JPEG or WebP, max 5 MB; no SVG)
      parameters:
        - $ref: "#/components/parameters/Csrf"
      requestBody:
        required: true
        content:
          image/png:
            schema:
              type: string
              contentMediaType: image/png
          image/jpeg:
            schema:
              type: string
              contentMediaType: image/jpeg
          image/webp:
            schema:
              type: string
              contentMediaType: image/webp
      responses:
        "200":
          description: Updated settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
    delete:
      tags:
        - Settings
      operationId: deleteLogo
      summary: Remove the logo
      parameters:
        - $ref: "#/components/parameters/Csrf"
      responses:
        "200":
          description: Updated settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /admin/api/catalog/brands:
    get:
      tags:
        - Catalog
      operationId: adminListBrands
      summary: All brands (any status)
      responses:
        "200":
          description: Brands.
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/IngestRecord"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /admin/api/catalog/brands/{external_id}:
    parameters:
      - $ref: "#/components/parameters/ExternalId"
    put:
      tags:
        - Catalog
      operationId: adminPutBrand
      summary: Create or replace a brand
      parameters:
        - $ref: "#/components/parameters/Csrf"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BrandInput"
      responses:
        "200":
          $ref: "#/components/responses/IngestResult"
        "201":
          $ref: "#/components/responses/IngestResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationFailed"
    patch:
      tags:
        - Catalog
      operationId: adminPatchBrand
      summary: Patch a brand
      parameters:
        - $ref: "#/components/parameters/Csrf"
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              type: object
      responses:
        "200":
          $ref: "#/components/responses/IngestResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
    delete:
      tags:
        - Catalog
      operationId: adminDeleteBrand
      summary: Delete a brand without products
      parameters:
        - $ref: "#/components/parameters/Csrf"
      responses:
        "200":
          $ref: "#/components/responses/IngestResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
  /admin/api/catalog/products:
    get:
      tags:
        - Catalog
      operationId: adminListProducts
      summary: Search products (any status)
      parameters:
        - name: q
          in: query
          description: Matches style number, name, GTIN, SKU (case-insensitive substring).
          schema:
            type: string
            maxLength: 200
        - name: brand
          in: query
          description: Brand external id.
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum:
              - published
              - unpublished
        - name: visibility
          in: query
          schema:
            type: string
            enum:
              - visible
              - hidden
              - pending_files
        - name: sort
          in: query
          schema:
            type: string
            enum:
              - updated_desc
              - style_number
              - name
            default: updated_desc
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Products.
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                  - next_cursor
                  - total
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/AdminProductSummary"
                  next_cursor:
                    $ref: "#/components/schemas/NextCursor"
                  total:
                    type: integer
                    minimum: 0
        "401":
          $ref: "#/components/responses/Unauthorized"
  /admin/api/catalog/products/{external_id}:
    parameters:
      - $ref: "#/components/parameters/ExternalId"
    get:
      tags:
        - Catalog
      operationId: adminGetProduct
      summary: Product with all variants and assets (any status)
      responses:
        "200":
          description: Product detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminProductDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags:
        - Catalog
      operationId: adminPutProduct
      summary: Create or replace a product
      parameters:
        - $ref: "#/components/parameters/Csrf"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "200":
          $ref: "#/components/responses/IngestResult"
        "201":
          $ref: "#/components/responses/IngestResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationFailed"
    patch:
      tags:
        - Catalog
      operationId: adminPatchProduct
      summary: Patch a product (e.g. publish/unpublish)
      parameters:
        - $ref: "#/components/parameters/Csrf"
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              type: object
      responses:
        "200":
          $ref: "#/components/responses/IngestResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
    delete:
      tags:
        - Catalog
      operationId: adminDeleteProduct
      summary: Delete a product with its variants and assets
      parameters:
        - $ref: "#/components/parameters/Csrf"
      responses:
        "200":
          $ref: "#/components/responses/IngestResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /admin/api/catalog/products/{external_id}/asset-order:
    put:
      tags:
        - Catalog
      operationId: adminPutAssetOrder
      summary: Reorder the images of one product colour
      description: Same as Ingest `PUT /products/{external_id}/asset-order`.
      parameters:
        - $ref: "#/components/parameters/ExternalId"
        - $ref: "#/components/parameters/Csrf"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssetOrder"
      responses:
        "200":
          description: Positions updated.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/IngestResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /admin/api/catalog/variants/{external_id}:
    parameters:
      - $ref: "#/components/parameters/ExternalId"
    put:
      tags:
        - Catalog
      operationId: adminPutVariant
      summary: Create or replace a variant
      parameters:
        - $ref: "#/components/parameters/Csrf"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VariantInput"
      responses:
        "200":
          $ref: "#/components/responses/IngestResult"
        "201":
          $ref: "#/components/responses/IngestResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
    patch:
      tags:
        - Catalog
      operationId: adminPatchVariant
      summary: Patch a variant
      parameters:
        - $ref: "#/components/parameters/Csrf"
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              type: object
      responses:
        "200":
          $ref: "#/components/responses/IngestResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      tags:
        - Catalog
      operationId: adminDeleteVariant
      summary: Delete a variant
      parameters:
        - $ref: "#/components/parameters/Csrf"
      responses:
        "200":
          $ref: "#/components/responses/IngestResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /admin/api/catalog/assets/{external_id}:
    parameters:
      - $ref: "#/components/parameters/ExternalId"
    put:
      tags:
        - Catalog
      operationId: adminPutAsset
      summary: Create or replace asset metadata
      parameters:
        - $ref: "#/components/parameters/Csrf"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssetInput"
      responses:
        "200":
          $ref: "#/components/responses/IngestResult"
        "201":
          $ref: "#/components/responses/IngestResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
    patch:
      tags:
        - Catalog
      operationId: adminPatchAsset
      summary: Patch asset metadata (role, view, rights, provenance, status)
      parameters:
        - $ref: "#/components/parameters/Csrf"
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              type: object
      responses:
        "200":
          $ref: "#/components/responses/IngestResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      tags:
        - Catalog
      operationId: adminDeleteAsset
      summary: Delete an asset
      parameters:
        - $ref: "#/components/parameters/Csrf"
      responses:
        "200":
          $ref: "#/components/responses/IngestResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /admin/api/catalog/assets/{external_id}/files/{rendition}:
    put:
      tags:
        - Catalog
      operationId: adminPutAssetFile
      summary: Upload the original or a client-generated rendition
      description: Same as Ingest `PUT /assets/{external_id}/files/{rendition}`. The admin-ui generates web/square/thumb in the browser when the node reports `renditions_server_generated=false` (Settings.node).
      parameters:
        - $ref: "#/components/parameters/ExternalId"
        - name: rendition
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/RenditionName"
        - name: OBX-Content-SHA256
          in: header
          required: false
          schema:
            $ref: "#/components/schemas/Sha256"
        - $ref: "#/components/parameters/Csrf"
      requestBody:
        required: true
        content:
          image/*:
            schema:
              type: string
              contentMediaType: application/octet-stream
      responses:
        "200":
          $ref: "#/components/responses/IngestResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /admin/api/catalog/blobs/{sha256}:
    parameters:
      - name: sha256
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/Sha256"
    head:
      tags:
        - Catalog
      operationId: adminHeadBlob
      summary: Does the node already have these bytes? (200/404)
      responses:
        "200":
          description: Present.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Not present.
    put:
      tags:
        - Catalog
      operationId: adminPutBlob
      summary: Upload bytes (same as Ingest PUT /blobs/{sha256})
      parameters:
        - $ref: "#/components/parameters/Csrf"
      requestBody:
        required: true
        content:
          image/*:
            schema:
              type: string
              contentMediaType: application/octet-stream
      responses:
        "200":
          description: Already present.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Blob"
        "201":
          description: Stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Blob"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /admin/api/imports:
    get:
      tags:
        - Imports
      operationId: listImportRuns
      summary: Import runs (uploads, API, scheduled), newest first
      parameters:
        - name: source_id
          in: query
          schema:
            $ref: "#/components/schemas/Id"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Runs.
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                  - next_cursor
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/ImportRun"
                  next_cursor:
                    $ref: "#/components/schemas/NextCursor"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags:
        - Imports
      operationId: createImportRun
      summary: Upload a CSV and/or images (same fields as Ingest POST /imports)
      parameters:
        - $ref: "#/components/parameters/Csrf"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                package:
                  type: string
                  contentMediaType: application/zip
                csv:
                  type: string
                  contentMediaType: text/csv
                assets_csv:
                  type: string
                  contentMediaType: text/csv
                images:
                  type: array
                  items:
                    type: string
                    contentMediaType: application/octet-stream
                images_manifest:
                  description: Same as Ingest ImagesManifest (blobs uploaded via /admin/api/catalog/blobs/{sha256}).
                  type: array
                  items:
                    type: object
                options:
                  type: object
                  properties:
                    mode:
                      type: string
                      enum:
                        - upsert
                        - mirror
                    allow_mass_unpublish:
                      type: boolean
                    dry_run:
                      type: boolean
                    default_language:
                      $ref: "#/components/schemas/LanguageTag"
      responses:
        "202":
          description: Run queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportRun"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
  /admin/api/imports/{id}:
    get:
      tags:
        - Imports
      operationId: getImportRun
      summary: One import run
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: The run.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportRun"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /admin/api/imports/{id}/errors:
    get:
      tags:
        - Imports
      operationId: listImportRunErrors
      summary: Row and file errors/warnings of a run
      parameters:
        - $ref: "#/components/parameters/IdPath"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Errors in file/row order.
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                  - next_cursor
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/ImportRowError"
                  next_cursor:
                    $ref: "#/components/schemas/NextCursor"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /admin/api/import-template.csv:
    get:
      tags:
        - Imports
      operationId: getImportTemplate
      summary: Canonical CSV template with header and two example rows
      responses:
        "200":
          description: CSV.
          content:
            text/csv:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
  /admin/api/import-sources:
    get:
      tags:
        - Imports
      operationId: listImportSources
      summary: Scheduled pull imports
      responses:
        "200":
          description: Sources (credentials never returned).
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/ImportSource"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags:
        - Imports
      operationId: createImportSource
      summary: Add a scheduled pull import (https_url, sftp or s3)
      parameters:
        - $ref: "#/components/parameters/Csrf"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportSourceInput"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportSource"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /admin/api/import-sources/{id}:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    get:
      tags:
        - Imports
      operationId: getImportSource
      summary: One source
      responses:
        "200":
          description: Source.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportSource"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags:
        - Imports
      operationId: updateImportSource
      summary: Update a source (merge patch; credentials write-only)
      parameters:
        - $ref: "#/components/parameters/Csrf"
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: "#/components/schemas/ImportSourceInput"
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportSource"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
    delete:
      tags:
        - Imports
      operationId: deleteImportSource
      summary: Delete a source (its runs stay in history)
      parameters:
        - $ref: "#/components/parameters/Csrf"
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /admin/api/import-sources/{id}/run:
    post:
      tags:
        - Imports
      operationId: runImportSource
      summary: Run now (also for manual schedules)
      parameters:
        - $ref: "#/components/parameters/IdPath"
        - $ref: "#/components/parameters/Csrf"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                dry_run:
                  type: boolean
                  default: false
                force:
                  type: boolean
                  default: false
                  description: Import even if the remote files did not change.
      responses:
        "202":
          description: Run queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportRun"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /admin/api/import-sources/{id}/test:
    post:
      tags:
        - Imports
      operationId: testImportSource
      summary: Check the connection and list what would be imported
      parameters:
        - $ref: "#/components/parameters/IdPath"
        - $ref: "#/components/parameters/Csrf"
      responses:
        "200":
          description: Test result.
          content:
            application/json:
              schema:
                type: object
                required:
                  - ok
                  - files
                properties:
                  ok:
                    type: boolean
                  message:
                    type:
                      - string
                      - "null"
                  host_key_fingerprint:
                    type:
                      - string
                      - "null"
                    description: "sftp: the key seen (to pin)."
                  files:
                    type: array
                    maxItems: 100
                    items:
                      type: object
                      required:
                        - name
                        - bytes
                      properties:
                        name:
                          type: string
                        bytes:
                          type: integer
                        modified_at:
                          type:
                            - string
                            - "null"
                          format: date-time
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /admin/api/retailers:
    get:
      tags:
        - Retailers
      operationId: listRetailers
      summary: Retailers
      parameters:
        - name: q
          in: query
          schema:
            type: string
            maxLength: 200
        - name: status
          in: query
          schema:
            type: string
            enum:
              - active
              - blocked
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Retailers.
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                  - next_cursor
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Retailer"
                  next_cursor:
                    $ref: "#/components/schemas/NextCursor"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags:
        - Retailers
      operationId: createRetailer
      summary: Add a retailer manually
      parameters:
        - $ref: "#/components/parameters/Csrf"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RetailerInput"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Retailer"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /admin/api/retailers/{id}:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    get:
      tags:
        - Retailers
      operationId: getRetailer
      summary: One retailer
      responses:
        "200":
          description: Retailer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Retailer"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags:
        - Retailers
      operationId: updateRetailer
      summary: Update a retailer, its grant, or block/unblock it (status)
      description: Blocking ends all its sessions and invalidates its API tokens immediately (`access_revoked`). Grant changes emit a grant change with resync for its consumers.
      parameters:
        - $ref: "#/components/parameters/Csrf"
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: "#/components/schemas/RetailerInput"
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Retailer"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
    delete:
      tags:
        - Retailers
      operationId: deleteRetailer
      summary: Delete a retailer with its accounts and API clients (download history is kept, anonymised to the retailer name)
      parameters:
        - $ref: "#/components/parameters/Csrf"
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /admin/api/access-requests:
    get:
      tags:
        - Retailers
      operationId: listAccessRequests
      summary: Access requests, newest first
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum:
              - pending
              - approved
              - rejected
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Requests.
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                  - next_cursor
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/AdminAccessRequest"
                  next_cursor:
                    $ref: "#/components/schemas/NextCursor"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /admin/api/access-requests/{id}:
    get:
      tags:
        - Retailers
      operationId: getAdminAccessRequest
      summary: One access request
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAccessRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /admin/api/access-requests/{id}/approve:
    post:
      tags:
        - Retailers
      operationId: approveAccessRequest
      summary: Approve
      description: |
        Creates (or links) the retailer, optionally invites the contact as a portal user
        (e-mail with a one-time link) and optionally creates an API client whose secret is
        handed to the requester exactly once via the protocol status endpoint. 409 `conflict`
        if not pending.
      parameters:
        - $ref: "#/components/parameters/IdPath"
        - $ref: "#/components/parameters/Csrf"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                retailer_id:
                  description: Link to an existing retailer instead of creating one.
                  $ref: "#/components/schemas/Id"
                brand_ids:
                  description: Grant; null/omitted = the requested brands, or all when none requested.
                  type:
                    - array
                    - "null"
                  items:
                    $ref: "#/components/schemas/Id"
                invite_portal_user:
                  type: boolean
                  description: Default true when 'portal' was requested.
                create_api_client:
                  type: boolean
                  description: Default true when 'api' was requested.
      responses:
        "200":
          description: Approved.
          content:
            application/json:
              schema:
                type: object
                required:
                  - access_request
                  - retailer
                properties:
                  access_request:
                    $ref: "#/components/schemas/AdminAccessRequest"
                  retailer:
                    $ref: "#/components/schemas/Retailer"
                  invite:
                    $ref: "#/components/schemas/InviteResult"
                  api_client:
                    $ref: "#/components/schemas/ApiClient"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /admin/api/access-requests/{id}/reject:
    post:
      tags:
        - Retailers
      operationId: rejectAccessRequest
      summary: Reject (reason optional, shown to the requester)
      parameters:
        - $ref: "#/components/parameters/IdPath"
        - $ref: "#/components/parameters/Csrf"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type:
                    - string
                    - "null"
                  maxLength: 2000
      responses:
        "200":
          description: Rejected.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAccessRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /admin/api/users:
    get:
      tags:
        - Retailers
      operationId: listUsers
      summary: Accounts (admins and retailer users)
      parameters:
        - name: role
          in: query
          schema:
            type: string
            enum:
              - admin
              - retailer
        - name: retailer_id
          in: query
          schema:
            $ref: "#/components/schemas/Id"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Users.
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                  - next_cursor
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/User"
                  next_cursor:
                    $ref: "#/components/schemas/NextCursor"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /admin/api/users/invites:
    post:
      tags:
        - Retailers
      operationId: inviteUser
      summary: Invite an admin or a retailer user by e-mail (one-time link, 7 days)
      description: 409 `conflict` when the e-mail already has an account on this node. When e-mail is not configured, `email_sent` is false and the admin copies `invite_url` manually.
      parameters:
        - $ref: "#/components/parameters/Csrf"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - role
              properties:
                email:
                  $ref: "#/components/schemas/Email"
                name:
                  type: string
                  maxLength: 200
                role:
                  type: string
                  enum:
                    - admin
                    - retailer
                retailer_id:
                  description: Required for role retailer.
                  $ref: "#/components/schemas/Id"
                language:
                  $ref: "#/components/schemas/LanguageTag"
      responses:
        "201":
          description: Invited.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InviteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /admin/api/users/{id}:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    patch:
      tags:
        - Retailers
      operationId: updateUser
      summary: Block/unblock or rename an account
      parameters:
        - $ref: "#/components/parameters/Csrf"
      requestBody:
        required: true
