        logo_url:
          type:
            - string
            - "null"
        accent_color:
          type:
            - string
            - "null"
          pattern: ^#[0-9a-fA-F]{6}$
        welcome_text:
          oneOf:
            - $ref: "#/components/schemas/LocalizedText"
            - type: "null"
        portal_name:
          description: The brand's own word for its portal, per language (e.g. {"nl":"Merkbeeldbank"}). The UI shows `<name> · <word>`; without a text for the reader's language it uses the brand's en text, then its first text, then the glossary word for that language.
          oneOf:
            - $ref: "#/components/schemas/LocalizedText"
            - type: "null"
        languages:
          type: array
          items:
            $ref: "#/components/schemas/LanguageTag"
        default_language:
          $ref: "#/components/schemas/LanguageTag"
        access_requests_enabled:
          type: boolean
        setup_required:
          type: boolean
        brands:
          type: array
          description: Published brands (for the request-access form).
          items:
            type: object
            required:
              - id
              - name
            properties:
              id:
                type: string
              name:
                type: string
