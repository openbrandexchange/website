        collections:
          type: array
          items:
            $ref: "#/components/schemas/FacetValue"
        target_groups:
          type: array
          items:
            $ref: "#/components/schemas/FacetValue"
    Selection:
      type: object
      required:
        - product_ids
        - image_count
      properties:
        product_ids:
          type: array
          items:
            $ref: "#/components/schemas/Id"
        image_count:
          type: integer
          description: Visible images across the selected products.
        updated_at:
          type:
            - string
            - "null"
          format: date-time
    DownloadJobInput:
      type: object
      required:
        - source
        - variant
      properties:
        source:
          type: string
          enum:
            - selection
            - products
            - filter
        product_ids:
          type: array
          maxItems: 10000
          description: For source products (e.g. matches of an EAN list).
          items:
            type: string
        filter:
          type: object
          description: For source filter; same keys as the portal product filters.
          properties:
            q:
              type: string
            brand_id:
              type: array
              items:
                type: string
            item_type:
              type: array
              items:
                type: string
            color:
              type: array
              items:
                type: string
            season:
              type: array
              items:
                type: string
            collection:
              type: array
              items:
                type: string
            target_group:
              type: array
              items:
                type: string
            updated_since:
              type: string
              format: date-time
        variant:
          type: string
          enum:
            - original
            - web
            - square
        include_data_csv:
          type: boolean
          default: true
    DownloadJob:
      type: object
      required:
        - id
        - status
        - source
        - variant
        - created_at
        - progress
      properties:
        id:
          $ref: "#/components/schemas/Id"
        status:
          type: string
          enum:
            - queued
            - running
            - succeeded
            - failed
            - expired
        source:
          type: string
          enum:
            - selection
            - products
            - filter
        variant:
          type: string
          enum:
            - original
            - web
            - square
        include_data_csv:
          type: boolean
        created_at:
          type: string
          format: date-time
        finished_at:
          type:
            - string
            - "null"
          format: date-time
        expires_at:
          type:
            - string
            - "null"
          format: date-time
        progress:
          type: object
          required:
            - done
            - total
          properties:
            done:
              type: integer
            total:
              type:
                - integer
                - "null"
        file_url:
          type:
            - string
            - "null"
          description: /admin/api/portal/download-jobs/{id}/file once succeeded.
        bytes:
          type:
            - integer
            - "null"
        files:
          type:
            - integer
            - "null"
        error:
          type:
            - string
            - "null"
    LocalizedText:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: https://openbrandexchange.com/schemas/v0.1/LocalizedText.json
      title: LocalizedText
      description: 'Free text per language, keyed by BCP 47 tag. At least one language. Example: {"nl": "Trui", "en": "Sweater"}.'
      type: object
      minProperties: 1
      patternProperties:
        ^[a-z]{2,3}(-[A-Z]{2})?$:
          type: string
          minLength: 1
          maxLength: 20000
      additionalProperties: false
    LanguageTag:
      type: string
      description: BCP 47 language tag, restricted to language or language-REGION.
      pattern: ^[a-z]{2,3}(-[A-Z]{2})?$
      examples:
        - nl
        - en
        - de-CH
    ErrorCode:
      type: string
      enum:
        - invalid_request
        - validation_failed
        - unauthorized
        - invalid_token
        - access_revoked
        - insufficient_scope
        - forbidden
        - not_found
        - method_not_allowed
        - conflict
        - precondition_failed
        - payload_too_large
        - unsupported_media_type
        - rate_limited
        - limit_exceeded
        - cursor_invalid
        - cursor_expired
        - export_expired
        - original_not_allowed
        - invalid_gtin
        - gtin_conflict
        - position_conflict
        - checksum_mismatch
        - blob_missing
        - upload_incomplete
        - unknown_parent
        - files_missing
        - import_invalid
        - mass_unpublish_refused
        - unsafe_url
        - csrf_failed
        - invalid_credentials
        - account_blocked
        - setup_required
        - setup_completed
        - invite_invalid
        - not_implemented
        - internal_error
        - service_unavailable
      description: Machine-readable OBX error code (see docs/protocol.md#errors). Clients MUST treat unknown codes by HTTP status.
    Problem:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: https://openbrandexchange.com/schemas/v0.1/Problem.json
      type: object
      title: Problem
      description: "application/problem+json (RFC 9457) error body. Exception: the OAuth2 token endpoint uses RFC 6749 error JSON."
      properties:
        type:
          type: string
          description: "URI identifying the problem type: `https://openbrandexchange.com/errors/<obx_error>`."
          format: uri
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type:
            - string
            - "null"
        instance:
          type:
            - string
            - "null"
        obx_error:
          $ref: "#/components/schemas/ErrorCode"
        errors:
          type: array
          items:
            type: object
            properties:
              pointer:
                type:
                  - string
                  - "null"
                description: JSON Pointer (RFC 6901) into the request body, or a CSV locator like 'row:12/gtin'.
              obx_error:
                $ref: "#/components/schemas/ErrorCode"
              detail:
                type: string
            required:
              - obx_error
              - detail
            additionalProperties: false
            patternProperties:
              ^x-[a-z0-9]+-[a-z0-9_-]+$: true
          description: Field-level errors (validation_failed).
        retry_after:
          type:
            - integer
            - "null"
          description: Seconds; mirrors Retry-After.
          minimum: 0
      required:
        - type
        - title
        - status
        - obx_error
      additionalProperties: false
      patternProperties:
        ^x-[a-z0-9]+-[a-z0-9_-]+$: true
    Email:
      type: string
      description: E-mail address.
      format: email
      maxLength: 254
    Id:
      type: string
      description: Opaque, node-assigned identifier. Stable for the life of the object. Consumers MUST treat it as opaque.
      pattern: ^[A-Za-z0-9][A-Za-z0-9._~-]{0,127}$
      examples:
        - prd_01J9ZK3Q7T5W
    DateTime:
      type: string
      description: RFC 3339 timestamp, UTC recommended.
      format: date-time
      examples:
        - 2026-09-28T10:00:00Z
    Channel:
      type: string
      enum:
        - webshop
        - marketplace
        - social
        - print
      description: Sales/marketing channel a rights grant covers.
    CountryCode:
      type: string
      description: ISO 3166-1 alpha-2 country code.
      pattern: ^[A-Z]{2}$
      examples:
        - NL
    Rights:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: https://openbrandexchange.com/schemas/v0.1/Rights.json
      type: object
      title: Rights
      properties:
        license:
          type: string
          enum:
            - retailer-use
            - custom
          description: "retailer-use: the standard OBX retailer licence (docs/protocol.md#rights): use to sell the brand's products in the listed channels and territories. custom: see license_text."
        license_text:
          type:
            - string
            - "null"
          description: Required when license is custom.
          maxLength: 20000
        channels:
          type: array
          items:
            $ref: "#/components/schemas/Channel"
          description: Channels the retailer may use the asset in.
          uniqueItems: true
        territories:
          type:
            - array
            - "null"
          items:
            $ref: "#/components/schemas/CountryCode"
          description: Allowed territories; null means worldwide.
          uniqueItems: true
        embargo_until:
          anyOf:
            - $ref: "#/components/schemas/DateTime"
              description: The asset is delivered ahead of time but MUST NOT be shown publicly before this moment.
            - type: "null"
        expires_at:
          anyOf:
            - $ref: "#/components/schemas/DateTime"
              description: After this moment the asset MUST no longer be used (it is also removed from the feed).
            - type: "null"
        credit:
          type:
            - string
            - "null"
          description: Required credit line, if any (e.g. photographer).
          maxLength: 500
        model_release:
          type:
            - boolean
            - "null"
          description: True when a model release covering the listed channels exists; null when unknown or not applicable.
      required:
        - license
        - channels
      additionalProperties: false
      patternProperties:
        ^x-[a-z0-9]+-[a-z0-9_-]+$: true
    PublicationStatus:
      type: string
      enum:
        - published
        - unpublished
      description: Brand-side publication state. Only 'published' objects (with published parents) are visible through the OBX Protocol.
    ExternalId:
      type: string
      description: The brand's own identifier for an object (from its PIM/ERP/spreadsheet). 1-200 characters, no control characters and no '/'. Leading/trailing whitespace is trimmed by nodes. Compared case-sensitively.
      minLength: 1
      maxLength: 200
      pattern: ^[^\x00-\x1F\x7F/]+$
      examples:
        - KO-1001
    RenditionName:
      type: string
      enum:
        - original
        - web
        - square
        - thumb
      description: Rendition name.
    IngestRecord:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: https://openbrandexchange.com/schemas/v0.1/IngestRecord.json
      type: object
      title: IngestRecord
      description: GET representation in the Ingest API (and the admin catalog).
      properties:
        kind:
          type: string
          enum:
            - brand
            - product
            - variant
            - asset
        id:
          $ref: "#/components/schemas/Id"
        external_id:
          $ref: "#/components/schemas/ExternalId"
        status:
          $ref: "#/components/schemas/PublicationStatus"
        visibility:
          type: string
          enum:
            - visible
            - hidden
            - pending_files
        etag:
          type: string
        created_at:
          $ref: "#/components/schemas/DateTime"
        updated_at:
          $ref: "#/components/schemas/DateTime"
        data:
          type: object
          description: "The stored write model (BrandInput/ProductInput/VariantInput/AssetInput) with defaults applied. For assets: `rights` is the full effective Rights object (node default rights merged with the fields the brand sent), `provenance` the full Provenance with its defaults, and `files` lists every current blob (original and web/square/thumb, including renditions the node made itself) with sha256, width and height."
        missing_files:
          type:
            - array
            - "null"
          items:
            $ref: "#/components/schemas/RenditionName"
          description: Present for assets only (an empty array when nothing is missing); omitted for brands, products and variants. Files still required before the asset becomes visible.
      required:
        - kind
        - id
        - external_id
        - status
        - visibility
        - etag
        - created_at
        - updated_at
        - data
      additionalProperties: false
      patternProperties:
        ^x-[a-z0-9]+-[a-z0-9_-]+$: true
    Url:
      type: string
      description: Absolute http(s) URL.
      format: uri
      pattern: ^https?://
      maxLength: 2048
    BrandInput:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: https://openbrandexchange.com/schemas/v0.1/BrandInput.json
      type: object
      title: BrandInput
      description: "Ingest write model for a brand. Key: the brand's external_id (path)."
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        logo_url:
          anyOf:
            - $ref: "#/components/schemas/Url"
              description: Fetched by the node once (SSRF-protected) or null.
            - type: "null"
        website:
          anyOf:
            - $ref: "#/components/schemas/Url"
            - type: "null"
        description:
          anyOf:
            - $ref: "#/components/schemas/LocalizedText"
            - type: "null"
        status:
          $ref: "#/components/schemas/PublicationStatus"
      required:
        - name
      additionalProperties: false
      patternProperties:
        ^x-[a-z0-9]+-[a-z0-9_-]+$: true
    IngestResult:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: https://openbrandexchange.com/schemas/v0.1/IngestResult.json
      type: object
      title: IngestResult
      properties:
        index:
          type:
            - integer
            - "null"
          description: 0-based position in the batch (batch only).
          minimum: 0
        op:
          type: string
          enum:
            - upsert
            - patch
            - delete
            - publish
            - unpublish
        kind:
          type: string
          enum:
            - brand
            - product
            - variant
            - asset
        external_id:
          $ref: "#/components/schemas/ExternalId"
        result:
          type: string
          enum:
            - created
            - updated
            - unchanged
            - deleted
            - error
          description: "unchanged: the stored representation is identical; no change entry was written."
        id:
          anyOf:
            - $ref: "#/components/schemas/Id"
              description: Protocol id of the object (null on error before creation).
            - type: "null"
        visibility:
          type:
            - string
            - "null"
          enum:
            - visible
            - hidden
            - pending_files
            - null
          description: "visible: served by the protocol. hidden: unpublished or a parent is hidden/missing. pending_files: asset waiting for its original or required renditions."
        etag:
          type:
            - string
            - "null"
        error:
          anyOf:
            - $ref: "#/components/schemas/Problem"
            - type: "null"
        warnings:
          type: array
          items:
            type: string
            maxLength: 1000
      required:
        - op
        - kind
        - external_id
        - result
      additionalProperties: false
      patternProperties:
        ^x-[a-z0-9]+-[a-z0-9_-]+$: true
    Cursor:
      type: string
      description: Opaque pagination or feed cursor. Clients MUST NOT parse or construct it.
      minLength: 1
      maxLength: 4096
    Sha256:
      type: string
      description: Lowercase hex SHA-256 of the exact bytes.
      pattern: ^[a-f0-9]{64}$
    Rendition:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: https://openbrandexchange.com/schemas/v0.1/Rendition.json
      type: object
      title: Rendition
      description: One downloadable form of an asset. original = uploaded bytes, unmodified; web = longest side <= 2000 px JPEG; square = web centred on a white square canvas; thumb = longest side <= 600 px JPEG.
      properties:
        name:
          $ref: "#/components/schemas/RenditionName"
        url:
          $ref: "#/components/schemas/Url"
          description: Download URL. Either short-lived signed (usable without Authorization until url_expires_at) or requiring the Bearer token. Never a permanent public URL. Clients MUST treat it as opaque.
        url_expires_at:
          anyOf:
            - $ref: "#/components/schemas/DateTime"
            - type: "null"
        content_type:
          type: string
          description: Media type. 'original' keeps the uploaded type; web/square/thumb are image/jpeg.
          examples:
            - image/jpeg
        width:
          type: integer
          minimum: 1
        height:
          type: integer
          minimum: 1
        bytes:
          type: integer
          minimum: 1
        sha256:
          $ref: "#/components/schemas/Sha256"
      required:
        - name
        - url
        - content_type
        - width
        - height
        - bytes
        - sha256
      additionalProperties: false
      patternProperties:
        ^x-[a-z0-9]+-[a-z0-9_-]+$: true
    Materials:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: https://openbrandexchange.com/schemas/v0.1/Materials.json
      type: array
      items:
        type: object
        properties:
          part:
            type: string
            description: "Garment part. Recommended keys: main, outer, lining, filling, trim, sole, upper, insole. 'main' when the product has one composition."
            pattern: ^[a-z][a-z0-9_]{0,63}$
            examples:
              - main
          fibers:
            type: array
            items:
              type: object
              properties:
                fiber:
                  type: string
                  description: Fibre key, lowercase English (recommended list in docs/import-format.md#fibres), e.g. cotton, organic_cotton, elastane, wool, merino_wool, polyester, recycled_polyester, polyamide, viscose, linen, silk, leather.
                  pattern: ^[a-z][a-z0-9_]{0,63}$
                percentage:
                  type: number
                  exclusiveMinimum: 0
                  maximum: 100
              required:
                - fiber
                - percentage
              additionalProperties: false
              patternProperties:
                ^x-[a-z0-9]+-[a-z0-9_-]+$: true
            minItems: 1
            description: Percentages of one part SHOULD sum to 100.
        required:
          - part
          - fibers
        additionalProperties: false
        patternProperties:
          ^x-[a-z0-9]+-[a-z0-9_-]+$: true
      title: Materials
      description: Fibre composition per part (textile labelling regulation / DPP ready).
    Care:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: https://openbrandexchange.com/schemas/v0.1/Care.json
      type: array
      items:
        type: object
        properties:
          code:
            type: string
            description: Care instruction key, ISO 3758 aligned (recommended list in docs/import-format.md#care-codes), e.g. wash_30, do_not_bleach, tumble_dry_low, iron_low, dry_clean_p, do_not_dry_clean.
            pattern: ^[a-z][a-z0-9_]{0,63}$
          text:
            anyOf:
              - $ref: "#/components/schemas/LocalizedText"
              - type: "null"
        required:
          - code
        additionalProperties: false
        patternProperties:
          ^x-[a-z0-9]+-[a-z0-9_-]+$: true
      title: Care
      description: Ordered care instructions.
    ProductInput:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: https://openbrandexchange.com/schemas/v0.1/ProductInput.json
      type: object
      title: ProductInput
      description: "Ingest write model for a product. Key: external_id (path); when a brand has no separate product id, use the style number."
      properties:
        brand_external_id:
          anyOf:
            - $ref: "#/components/schemas/ExternalId"
              description: Required unless the node has exactly one brand.
            - type: "null"
        style_number:
          type: string
          minLength: 1
          maxLength: 200
        name:
          $ref: "#/components/schemas/LocalizedText"
        description:
          anyOf:
            - $ref: "#/components/schemas/LocalizedText"
            - type: "null"
        item_type:
          type:
            - string
            - "null"
          pattern: ^[a-z][a-z0-9_]{0,63}$
        gpc_brick:
          type:
            - string
            - "null"
          pattern: ^[0-9]{8}$
        target_group:
          type:
            - string
            - "null"
          pattern: ^[a-z][a-z0-9_]{0,63}$
        season:
          type:
            - string
            - "null"
          maxLength: 64
        collection:
          type:
            - string
            - "null"
          maxLength: 200
        materials:
          anyOf:
            - $ref: "#/components/schemas/Materials"
            - type: "null"
        care:
          anyOf:
            - $ref: "#/components/schemas/Care"
            - type: "null"
        country_of_origin:
          anyOf:
            - $ref: "#/components/schemas/CountryCode"
            - type: "null"
        dpp_url:
          anyOf:
            - $ref: "#/components/schemas/Url"
            - type: "null"
        attributes:
          type:
            - object
            - "null"
          propertyNames:
            pattern: ^[a-z][a-z0-9_]{0,63}$
          additionalProperties:
            anyOf:
              - type:
                  - string
                  - number
                  - boolean
              - $ref: "#/components/schemas/LocalizedText"
        status:
          $ref: "#/components/schemas/PublicationStatus"
      required:
        - style_number
        - name
      additionalProperties: false
      patternProperties:
        ^x-[a-z0-9]+-[a-z0-9_-]+$: true
    GtinInput:
      type: string
      description: "A GTIN as supplied: GTIN-8, UPC-A (12), EAN-13 or GTIN-14 digits."
      pattern: ^([0-9]{8}|[0-9]{12,14})$
      examples:
        - "2000010010011"
    Color:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: https://openbrandexchange.com/schemas/v0.1/Color.json
      type: object
      title: Color
      properties:
        code:
          type: string
          description: The brand's colour code, stable key (e.g. 'NVY', '001').
          minLength: 1
          maxLength: 64
        name:
          anyOf:
            - $ref: "#/components/schemas/LocalizedText"
            - type: "null"
        supplier_color:
          type:
            - string
            - "null"
          description: Colour name as used in the brand's own systems/labels.
          maxLength: 200
      required:
        - code
      additionalProperties: false
      patternProperties:
        ^x-[a-z0-9]+-[a-z0-9_-]+$: true
    VariantInput:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: https://openbrandexchange.com/schemas/v0.1/VariantInput.json
      type: object
      title: VariantInput
      description: "Ingest write model for a variant. Key: external_id (path); default convention = the GTIN, else `<style>-<color>-<size>`."
      properties:
        product_external_id:
          $ref: "#/components/schemas/ExternalId"
        gtin:
          anyOf:
            - $ref: "#/components/schemas/GtinInput"
              description: Check digit MUST be valid (invalid_gtin). Unique within the node (gtin_conflict).
            - type: "null"
        sku:
          type:
            - string
            - "null"
          maxLength: 200
        color:
          $ref: "#/components/schemas/Color"
        size:
          type:
            - string
            - "null"
          maxLength: 64
        size_system:
          type:
            - string
            - "null"
          maxLength: 16
        status:
          $ref: "#/components/schemas/PublicationStatus"
      required:
        - product_external_id
        - color
      additionalProperties: false
      patternProperties:
        ^x-[a-z0-9]+-[a-z0-9_-]+$: true
    Role:
      type: string
      enum:
        - packshot
        - model
        - detail
        - ghost
        - flatlay
        - scene
        - swatch
        - size_chart
        - other
      description: What the image shows. Stable key; labels are presentation.
    View:
      type: string
      enum:
        - front
        - back
        - side
        - left
        - right
        - top
        - bottom
        - tilted_left
        - tilted_right
        - inside
        - detail
        - other
      description: Viewing angle. Aligned with Fashion Cloud product_view plus 'inside'.
    AssetInput:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: https://openbrandexchange.com/schemas/v0.1/AssetInput.json
      type: object
      title: AssetInput
      description: "Ingest write model for an asset. Key: external_id (path); filename-pattern convention = `<style>_<color>_<position>`."
      properties:
        product_external_id:
          $ref: "#/components/schemas/ExternalId"
        color_code:
          type:
            - string
            - "null"
          maxLength: 64
        variant_external_ids:
          type:
            - array
            - "null"
          items:
            $ref: "#/components/schemas/ExternalId"
        media_type:
          type: string
          enum:
            - image
        role:
          $ref: "#/components/schemas/Role"
        view:
          anyOf:
            - $ref: "#/components/schemas/View"
            - type: "null"
        position:
          type: integer
          minimum: 1
          maximum: 999
        filename:
          type:
            - string
            - "null"
          description: Download filename; default `<external_id>.<ext>`.
          maxLength: 255
        alt_text:
          anyOf:
            - $ref: "#/components/schemas/LocalizedText"
            - type: "null"
        rights:
          type:
            - object
            - "null"
          properties:
            license:
              type: string
              enum:
                - retailer-use
                - custom
            license_text:
              type:
                - string
                - "null"
              maxLength: 20000
            channels:
              type: array
              items:
                $ref: "#/components/schemas/Channel"
              uniqueItems: true
            territories:
              type:
                - array
                - "null"
              items:
                $ref: "#/components/schemas/CountryCode"
              uniqueItems: true
            embargo_until:
              anyOf:
                - $ref: "#/components/schemas/DateTime"
                - type: "null"
            expires_at:
              anyOf:
                - $ref: "#/components/schemas/DateTime"
                - type: "null"
            credit:
              type:
                - string
                - "null"
              maxLength: 500
            model_release:
              type:
                - boolean
                - "null"
          additionalProperties: false
          patternProperties:
            ^x-[a-z0-9]+-[a-z0-9_-]+$: true
          description: Partial Rights; omitted fields take the node's default rights (Settings). null = all defaults.
        provenance:
          type:
            - object
            - "null"
          properties:
            ai_generated:
              type: boolean
            ai_edited:
              type: boolean
            source:
              type: string
              enum:
                - photo
                - generated
                - composite
            c2pa:
              type: string
              enum:
                - embedded
                - sidecar
                - none
            c2pa_manifest_url:
              anyOf:
                - $ref: "#/components/schemas/Url"
                - type: "null"
            generator:
              type:
                - string
                - "null"
              maxLength: 200
          additionalProperties: false
          patternProperties:
            ^x-[a-z0-9]+-[a-z0-9_-]+$: true
          description: Omitted fields default to ai_generated=false, ai_edited=false, source=photo (generated when ai_generated), c2pa=none (nodes MAY detect embedded C2PA).
        files:
          type:
            - object
            - "null"
          description: Attach previously uploaded blobs atomically. Omit to keep current files (or upload via PUT .../files/{rendition}).
          properties:
            original:
              type: object
              description: Reference to an uploaded blob. width/height are required for client-generated renditions and for originals whose type the node cannot parse (e.g. TIFF).
              properties:
                sha256:
                  $ref: "#/components/schemas/Sha256"
                width:
                  type:
                    - integer
                    - "null"
                  minimum: 1
                height:
                  type:
                    - integer
                    - "null"
                  minimum: 1
              required:
                - sha256
              additionalProperties: false
              patternProperties:
                ^x-[a-z0-9]+-[a-z0-9_-]+$: true
            web:
              type: object
              description: Reference to an uploaded blob. width/height are required for client-generated renditions and for originals whose type the node cannot parse (e.g. TIFF).
              properties:
                sha256:
                  $ref: "#/components/schemas/Sha256"
                width:
                  type:
                    - integer
                    - "null"
                  minimum: 1
                height:
                  type:
                    - integer
                    - "null"
                  minimum: 1
              required:
                - sha256
              additionalProperties: false
              patternProperties:
                ^x-[a-z0-9]+-[a-z0-9_-]+$: true
            square:
              type: object
              description: Reference to an uploaded blob. width/height are required for client-generated renditions and for originals whose type the node cannot parse (e.g. TIFF).
              properties:
                sha256:
                  $ref: "#/components/schemas/Sha256"
                width:
                  type:
                    - integer
                    - "null"
                  minimum: 1
                height:
                  type:
                    - integer
                    - "null"
                  minimum: 1
              required:
                - sha256
              additionalProperties: false
              patternProperties:
                ^x-[a-z0-9]+-[a-z0-9_-]+$: true
            thumb:
              type: object
              description: Reference to an uploaded blob. width/height are required for client-generated renditions and for originals whose type the node cannot parse (e.g. TIFF).
              properties:
                sha256:
                  $ref: "#/components/schemas/Sha256"
                width:
                  type:
                    - integer
                    - "null"
                  minimum: 1
                height:
                  type:
                    - integer
                    - "null"
                  minimum: 1
              required:
                - sha256
              additionalProperties: false
              patternProperties:
                ^x-[a-z0-9]+-[a-z0-9_-]+$: true
          additionalProperties: false
          patternProperties:
            ^x-[a-z0-9]+-[a-z0-9_-]+$: true
        status:
          $ref: "#/components/schemas/PublicationStatus"
      required:
        - product_external_id
        - role
        - position
      additionalProperties: false
      patternProperties:
        ^x-[a-z0-9]+-[a-z0-9_-]+$: true
    Blob:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: https://openbrandexchange.com/schemas/v0.1/Blob.json
      type: object
      title: Blob
      properties:
        sha256:
          $ref: "#/components/schemas/Sha256"
        bytes:
          type: integer
          minimum: 1
        content_type:
          type: string
        width:
          type:
            - integer
            - "null"
          minimum: 1
        height:
          type:
            - integer
            - "null"
          minimum: 1
        created:
          type: boolean
          description: false when the node already had these bytes (dedupe).
      required:
        - sha256
        - bytes
        - content_type
        - created
      additionalProperties: false
      patternProperties:
        ^x-[a-z0-9]+-[a-z0-9_-]+$: true
    ImportRowError:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: https://openbrandexchange.com/schemas/v0.1/ImportRowError.json
      type: object
      title: ImportRowError
      properties:
        file:
          type: string
          description: products.csv, assets.csv or the image file name.
          maxLength: 255
        row:
          type:
            - integer
            - "null"
          description: 1-based data row; null for header, file-level and image-file problems.
          minimum: 1
        column:
          type:
            - string
            - "null"
          maxLength: 100
        severity:
          type: string
          enum:
            - error
            - warning
          description: "error: row/file skipped. warning: imported with a correction."
        obx_error:
          $ref: "#/components/schemas/ErrorCode"
        detail:
          type: string
          maxLength: 2000
        value:
          type:
            - string
            - "null"
          maxLength: 500
      required:
        - file
        - row
        - severity
        - obx_error
        - detail
      additionalProperties: false
      patternProperties:
        ^x-[a-z0-9]+-[a-z0-9_-]+$: true
    ImportRun:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: https://openbrandexchange.com/schemas/v0.1/ImportRun.json
      type: object
      title: ImportRun
      properties:
        id:
          $ref: "#/components/schemas/Id"
        source_id:
          anyOf:
            - $ref: "#/components/schemas/Id"
              description: ImportSource for scheduled/pull runs; null for uploads.
            - type: "null"
        trigger:
          type: string
          enum:
            - upload
            - api
            - schedule
            - manual_run
            - cli
        status:
          type: string
          enum:
            - queued
            - running
            - succeeded
            - failed
          description: succeeded may still contain row errors (see counts.errors).
        mode:
          type: string
          enum:
            - upsert
            - mirror
        dry_run:
          type: boolean
        created_at:
          $ref: "#/components/schemas/DateTime"
        started_at:
          anyOf:
            - $ref: "#/components/schemas/DateTime"
            - type: "null"
        finished_at:
          anyOf:
            - $ref: "#/components/schemas/DateTime"
            - type: "null"
        files:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
                maxLength: 1024
              bytes:
                type: integer
                minimum: 0
              sha256:
                anyOf:
                  - $ref: "#/components/schemas/Sha256"
                  - type: "null"
            required:
              - name
              - bytes
            additionalProperties: false
            patternProperties:
              ^x-[a-z0-9]+-[a-z0-9_-]+$: true
        counts:
          type: object
          properties:
            rows:
              type: integer
              minimum: 0
            files:
              type: integer
              minimum: 0
            created:
              type: integer
              minimum: 0
            updated:
              type: integer
              minimum: 0
            unchanged:
              type: integer
              minimum: 0
            unpublished:
              type: integer
              minimum: 0
            errors:
              type: integer
              minimum: 0
            warnings:
              type: integer
              minimum: 0
          required:
            - rows
            - files
            - created
            - updated
            - unchanged
            - unpublished
            - errors
            - warnings
          additionalProperties: false
          patternProperties:
            ^x-[a-z0-9]+-[a-z0-9_-]+$: true
        error:
          anyOf:
            - $ref: "#/components/schemas/Problem"
            - type: "null"
        errors_preview:
          type: array
          items:
            $ref: "#/components/schemas/ImportRowError"
          description: First <= 50 errors; page through the full list via the errors endpoint.
          maxItems: 50
      required:
        - id
        - source_id
        - trigger
        - status
        - mode
        - dry_run
        - created_at
        - counts
      additionalProperties: false
      patternProperties:
        ^x-[a-z0-9]+-[a-z0-9_-]+$: true
    ImportSource:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: https://openbrandexchange.com/schemas/v0.1/ImportSource.json
      type: object
      title: ImportSource
      description: A scheduled pull import configured in the node admin. Unchanged remote files (same ETag/size+mtime/sha256) are skipped.
      properties:
        id:
          $ref: "#/components/schemas/Id"
        name:
          type: string
          minLength: 1
          maxLength: 200
        kind:
          type: string
          enum:
            - https_url
            - sftp
            - s3
        enabled:
          type: boolean
        schedule:
          type: object
          properties:
            frequency:
              type: string
              enum:
                - manual
                - hourly
                - daily
                - weekly
            time:
              type:
                - string
                - "null"
              description: HH:MM (24 h) for daily/weekly.
              pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
            weekday:
              type:
                - integer
                - "null"
              description: 1 = Monday ... 7 = Sunday, for weekly.
              minimum: 1
              maximum: 7
            timezone:
              type: string
              description: IANA timezone, default UTC.
              examples:
                - Europe/Amsterdam
          required:
            - frequency
          additionalProperties: false
          patternProperties:
            ^x-[a-z0-9]+-[a-z0-9_-]+$: true
        mode:
          type: string
          enum:
            - upsert
            - mirror
          description: mirror also unpublishes products (of the brands in the file) that are absent; refused when it would unpublish more than half of them (mass_unpublish_refused) unless allow_mass_unpublish.
        allow_mass_unpublish:
          type: boolean
        config:
          description: Non-secret settings per kind.
          oneOf:
            - type: object
              properties:
                kind:
                  const: https_url
                url:
                  $ref: "#/components/schemas/Url"
                  description: HTTPS URL of a canonical CSV or a package zip. Private, loopback and link-local addresses are refused (unsafe_url) unless the node runs with OBX_ALLOW_PRIVATE_URLS=true.
                images_url:
                  anyOf:
                    - $ref: "#/components/schemas/Url"
                      description: Optional separate images zip.
                    - type: "null"
              required:
                - kind
                - url
              additionalProperties: false
              patternProperties:
                ^x-[a-z0-9]+-[a-z0-9_-]+$: true
            - type: object
              properties:
                kind:
                  const: sftp
                host:
                  type: string
                  minLength: 1
                  maxLength: 255
                port:
                  type: integer
                  minimum: 1
                  maximum: 65535
                  default: 22
                username:
                  type: string
                  minLength: 1
                  maxLength: 200
                path:
                  type: string
                  description: Folder containing products.csv (optional assets.csv) and images, or a package zip path.
                  minLength: 1
                  maxLength: 1024
                host_key_fingerprint:
                  type:
                    - string
                    - "null"
                  description: SHA256:... ; when null the first key seen is pinned (trust on first use).
                  maxLength: 200
              required:
                - kind
                - host
                - username
                - path
              additionalProperties: false
              patternProperties:
                ^x-[a-z0-9]+-[a-z0-9_-]+$: true
            - type: object
              properties:
                kind:
                  const: s3
                endpoint:
                  anyOf:
                    - $ref: "#/components/schemas/Url"
                      description: S3-compatible endpoint (R2, MinIO, ...); null = AWS.
                    - type: "null"
                region:
                  type: string
                  maxLength: 64
                bucket:
                  type: string
                  minLength: 3
                  maxLength: 63
                prefix:
                  type: string
                  description: Key prefix acting as the folder.
                  maxLength: 1024
                path_style:
                  type: boolean
              required:
                - kind
                - region
                - bucket
                - prefix
              additionalProperties: false
              patternProperties:
                ^x-[a-z0-9]+-[a-z0-9_-]+$: true
        credentials:
          type:
            - object
            - "null"
          properties:
            password:
              type:
                - string
                - "null"
              maxLength: 1000
            private_key:
              type:
                - string
                - "null"
              description: PEM/OpenSSH private key.
              maxLength: 20000
            access_key_id:
              type:
                - string
                - "null"
              maxLength: 200
            secret_access_key:
              type:
                - string
                - "null"
              maxLength: 1000
            headers:
              type:
                - object
                - "null"
              description: Extra request headers for https_url (e.g. Authorization).
              additionalProperties:
                type: string
                maxLength: 4000
              maxProperties: 10
          additionalProperties: false
          patternProperties:
            ^x-[a-z0-9]+-[a-z0-9_-]+$: true
          description: WRITE-ONLY. Accepted on create/update, never returned. Omit to keep stored values; send null for a field to clear it.
        credentials_set:
          type: object
          description: "Read-only: which credentials are stored."
          properties:
            password:
              type: boolean
            private_key:
              type: boolean
            access_key_id:
              type: boolean
            secret_access_key:
              type: boolean
            headers:
              type: array
              items:
                type: string
              description: Names of stored headers.
          additionalProperties: false
          patternProperties:
            ^x-[a-z0-9]+-[a-z0-9_-]+$: true
        last_run:
          anyOf:
            - $ref: "#/components/schemas/ImportRun"
            - type: "null"
        next_run_at:
          anyOf:
            - $ref: "#/components/schemas/DateTime"
            - type: "null"
        created_at:
          $ref: "#/components/schemas/DateTime"
        updated_at:
          $ref: "#/components/schemas/DateTime"
      required:
        - id
        - name
        - kind
        - enabled
        - schedule
        - mode
        - config
        - created_at
        - updated_at
      additionalProperties: false
      patternProperties:
        ^x-[a-z0-9]+-[a-z0-9_-]+$: true
    Scope:
      type: string
      enum:
        - catalog:read
        - media:read
        - media:original
        - usage:write
      description: OBX Protocol OAuth2 scope.
    IngestScope:
      type: string
      enum:
        - ingest:read
        - ingest:write
        - ingest:delete
      description: OBX Ingest token scope.
    WebhookSubscription:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: https://openbrandexchange.com/schemas/v0.1/WebhookSubscription.json
      type: object
      title: WebhookSubscription
      properties:
        id:
          $ref: "#/components/schemas/Id"
        url:
          $ref: "#/components/schemas/Url"
          description: HTTPS endpoint receiving events (http only for localhost in dev mode).
        events:
          type: array
          items:
            type: string
            pattern: ^[a-z_]+\.[a-z_]+$
          description: Event types; ['*'] not allowed, list explicitly.
          minItems: 1
          uniqueItems: true
        secret:
          type:
            - string
            - "null"
          description: Signing secret, 'whsec_' + random. Returned only on creation.
        status:
          type: string
          enum:
            - active
            - disabled
          description: disabled after 3 days of failed deliveries (re-enable by recreating).
        created_at:
          $ref: "#/components/schemas/DateTime"
        last_delivery_at:
          anyOf:
            - $ref: "#/components/schemas/DateTime"
            - type: "null"
        last_status:
          type:
            - integer
            - "null"
      required:
        - id
        - url
        - events
        - status
        - created_at
      additionalProperties: false
      patternProperties:
        ^x-[a-z0-9]+-[a-z0-9_-]+$: true
    Brand:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: https://openbrandexchange.com/schemas/v0.1/Brand.json
      type: object
      title: Brand
      description: A brand (label) published by this node. One node (one brand company) may publish several brands.
      properties:
        id:
          $ref: "#/components/schemas/Id"
        external_id:
          $ref: "#/components/schemas/ExternalId"
        name:
          type: string
          description: Brand name as shown to retailers.
          minLength: 1
          maxLength: 200
        logo_url:
          anyOf:
            - $ref: "#/components/schemas/Url"
              description: Public logo URL (PNG/JPEG/WebP/SVG). Logos are public branding.
            - type: "null"
        website:
          anyOf:
            - $ref: "#/components/schemas/Url"
            - type: "null"
        description:
          anyOf:
            - $ref: "#/components/schemas/LocalizedText"
            - type: "null"
        updated_at:
          $ref: "#/components/schemas/DateTime"
      required:
        - id
        - external_id
        - name
        - updated_at
      additionalProperties: false
      patternProperties:
        ^x-[a-z0-9]+-[a-z0-9_-]+$: true
    Gtin14:
      type: string
      description: GTIN normalised to 14 digits (left-padded with zeros).
      pattern: ^[0-9]{14}$
      examples:
        - "02000010010011"
    Variant:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: https://openbrandexchange.com/schemas/v0.1/Variant.json
      type: object
      title: Variant
      description: A sellable colour/size combination of a product.
      properties:
        id:
          $ref: "#/components/schemas/Id"
        external_id:
          $ref: "#/components/schemas/ExternalId"
        product_id:
          $ref: "#/components/schemas/Id"
        brand_id:
          $ref: "#/components/schemas/Id"
        gtin:
          anyOf:
            - $ref: "#/components/schemas/Gtin14"
              description: Normalised GTIN-14. The consumer's match key.
            - type: "null"
        gtin_original:
          anyOf:
            - $ref: "#/components/schemas/GtinInput"
              description: GTIN exactly as the brand supplied it (e.g. 13-digit EAN).
            - type: "null"
        sku:
          type:
            - string
            - "null"
          description: The brand's article/SKU number for this variant.
          maxLength: 200
        color:
          $ref: "#/components/schemas/Color"
        size:
          type:
            - string
            - "null"
          description: Size label, e.g. 'M', '42', '32/34', 'ONE SIZE'.
          maxLength: 64
        size_system:
          type:
            - string
            - "null"
          description: Optional size system, e.g. EU, UK, US, INT, FR, IT.
          maxLength: 16
        updated_at:
          $ref: "#/components/schemas/DateTime"
      required:
        - id
        - external_id
        - product_id
        - brand_id
        - color
        - updated_at
      additionalProperties: false
      patternProperties:
        ^x-[a-z0-9]+-[a-z0-9_-]+$: true
    Provenance:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: https://openbrandexchange.com/schemas/v0.1/Provenance.json
      type: object
      title: Provenance
      description: Origin of the image, required so AI provenance (EU AI Act art. 50) survives the brand -> retailer -> shop chain.
      properties:
        ai_generated:
          type: boolean
          description: True when the image is (mostly) generated by AI. A publisher that knows this MUST say so.
        ai_edited:
          type: boolean
          description: True when a real photo was materially edited with generative AI (e.g. background, model, garment fit).
        source:
          type: string
          enum:
            - photo
            - generated
            - composite
          description: "photo: camera original (possibly retouched); generated: synthesised; composite: photo combined with generated parts."
        c2pa:
          type: string
          enum:
            - embedded
            - sidecar
            - none
          description: "Where C2PA Content Credentials live. embedded: inside the original bytes (preserved: originals are served unmodified)."
        c2pa_manifest_url:
          anyOf:
            - $ref: "#/components/schemas/Url"
              description: Sidecar manifest URL (when c2pa is sidecar).
            - type: "null"
        generator:
          type:
            - string
            - "null"
          description: Optional free-text tool/model name.
          maxLength: 200
      required:
        - ai_generated
        - ai_edited
        - source
        - c2pa
      additionalProperties: false
      patternProperties:
        ^x-[a-z0-9]+-[a-z0-9_-]+$: true
    Asset:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: https://openbrandexchange.com/schemas/v0.1/Asset.json
      type: object
      title: Asset
      description: A final, published product image with order, rights and provenance.
      properties:
        id:
          $ref: "#/components/schemas/Id"
        external_id:
          $ref: "#/components/schemas/ExternalId"
        product_id:
          $ref: "#/components/schemas/Id"
        brand_id:
          $ref: "#/components/schemas/Id"
        media_type:
          type: string
          enum:
            - image
          description: Kind of media. v0.1 only defines image; consumers MUST ignore unknown values.
        color_code:
          type:
            - string
            - "null"
          description: The colour this asset belongs to (Variant.color.code); null = all colours of the product.
          maxLength: 64
        variant_ids:
          type:
            - array
            - "null"
          items:
            $ref: "#/components/schemas/Id"
          description: "Optional: restrict the asset to specific variants (rare)."
        role:
          $ref: "#/components/schemas/Role"
        view:
          anyOf:
            - $ref: "#/components/schemas/View"
            - type: "null"
        position:
          type: integer
          description: Order within (product, color_code), 1-based. Unique among visible assets of that product+colour.
          minimum: 1
          maximum: 999
        filename:
          type: string
          description: Suggested download filename for the original, e.g. KO-1001_NVY_1.jpg.
          minLength: 1
          maxLength: 255
        alt_text:
          anyOf:
            - $ref: "#/components/schemas/LocalizedText"
            - type: "null"
        content_type:
          type: string
          description: Media type of the original.
          examples:
            - image/jpeg
        width:
          type: integer
          description: Original width in px.
          minimum: 1
        height:
          type: integer
          description: Original height in px.
          minimum: 1
        bytes:
          type: integer
          description: Original size in bytes.
          minimum: 1
        sha256:
          $ref: "#/components/schemas/Sha256"
          description: SHA-256 of the original bytes (always present, even when the original rendition is not offered to this consumer).
        rights:
          $ref: "#/components/schemas/Rights"
        provenance:
          $ref: "#/components/schemas/Provenance"
        renditions:
          type: object
          description: "Renditions by name. 'original' is present only when the brand allows original downloads AND the caller has media:original (portal: the retailer is allowed originals)."
          properties:
            original:
              $ref: "#/components/schemas/Rendition"
            web:
              $ref: "#/components/schemas/Rendition"
            square:
              $ref: "#/components/schemas/Rendition"
            thumb:
              $ref: "#/components/schemas/Rendition"
          required:
            - web
            - square
            - thumb
          additionalProperties: false
          patternProperties:
            ^x-[a-z0-9]+-[a-z0-9_-]+$: true
        updated_at:
          $ref: "#/components/schemas/DateTime"
      required:
        - id
        - external_id
        - product_id
        - brand_id
        - media_type
        - color_code
        - role
        - view
        - position
        - filename
        - content_type
        - width
        - height
        - bytes
        - sha256
        - rights
        - provenance
        - renditions
        - updated_at
      additionalProperties: false
      patternProperties:
        ^x-[a-z0-9]+-[a-z0-9_-]+$: true
    Product:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: https://openbrandexchange.com/schemas/v0.1/Product.json
      type: object
      title: Product
      description: A style/model. In /changes entries 'data' holds the product without 'variants' and 'assets'; product endpoints return ProductDetail (with both arrays).
      properties:
        id:
          $ref: "#/components/schemas/Id"
        external_id:
          $ref: "#/components/schemas/ExternalId"
        brand_id:
          $ref: "#/components/schemas/Id"
        style_number:
          type: string
          description: The brand's style/model number.
          minLength: 1
          maxLength: 200
        name:
          $ref: "#/components/schemas/LocalizedText"
        description:
          anyOf:
            - $ref: "#/components/schemas/LocalizedText"
            - type: "null"
        item_type:
          type:
            - string
            - "null"
          description: Open vocabulary; recommended keys in docs/protocol.md#item-types (e.g. t_shirt, sweater, jacket, jeans, bag).
          pattern: ^[a-z][a-z0-9_]{0,63}$
        gpc_brick:
          type:
            - string
            - "null"
          description: Optional GS1 GPC brick code.
          pattern: ^[0-9]{8}$
        target_group:
          type:
            - string
            - "null"
          description: "Open vocabulary; recommended: women, men, unisex, girls, boys, kids, baby."
          pattern: ^[a-z][a-z0-9_]{0,63}$
        season:
          type:
            - string
            - "null"
          description: Season label as used by the brand, e.g. SS26, AW26, NOS.
          maxLength: 64
        collection:
          type:
            - string
            - "null"
          description: Collection name.
          maxLength: 200
        materials:
          anyOf:
            - $ref: "#/components/schemas/Materials"
            - type: "null"
        care:
          anyOf:
            - $ref: "#/components/schemas/Care"
            - type: "null"
        country_of_origin:
          anyOf:
            - $ref: "#/components/schemas/CountryCode"
            - type: "null"
        dpp_url:
          anyOf:
            - $ref: "#/components/schemas/Url"
              description: Link to the product's Digital Product Passport, when one exists.
            - type: "null"
        attributes:
          type:
            - object
            - "null"
          description: Additional brand attributes. Keys lower_snake_case; values string, number, boolean or LocalizedText.
          propertyNames:
            pattern: ^[a-z][a-z0-9_]{0,63}$
          additionalProperties:
            anyOf:
              - type:
                  - string
                  - number
                  - boolean
              - $ref: "#/components/schemas/LocalizedText"
        created_at:
          $ref: "#/components/schemas/DateTime"
        updated_at:
          $ref: "#/components/schemas/DateTime"
          description: Changes whenever the protocol representation of this product (own fields only) changes.
        variants:
          type: array
          items:
            $ref: "#/components/schemas/Variant"
          description: Present in product responses (GET /products...), absent in /changes data. Only published variants.
        assets:
          type: array
          items:
            $ref: "#/components/schemas/Asset"
          description: Present in product responses (GET /products...), absent in /changes data. Only visible assets, ordered by color_code then position.
      required:
        - id
        - external_id
        - brand_id
        - style_number
        - name
        - updated_at
      additionalProperties: false
      patternProperties:
        ^x-[a-z0-9]+-[a-z0-9_-]+$: true
    ProductDetail:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: https://openbrandexchange.com/schemas/v0.1/ProductDetail.json
      title: ProductDetail
      description: A Product with its published variants and visible assets embedded. Returned by GET /products, /products/{id} and by-GTIN lookups.
      type: object
      $ref: "#/components/schemas/Product"
      required:
        - variants
        - assets
      properties:
        variants:
          type: array
          items:
            $ref: "#/components/schemas/Variant"
        assets:
          type: array
          items:
            $ref: "#/components/schemas/Asset"
    GtinLookupResult:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: https://openbrandexchange.com/schemas/v0.1/GtinLookupResult.json
      type: object
      title: GtinLookupResult
      properties:
        results:
          type: array
          items:
            type: object
            properties:
              input:
                type: string
                description: The code as submitted (trimmed).
                maxLength: 64
              gtin:
                anyOf:
                  - $ref: "#/components/schemas/Gtin14"
                  - type: "null"
              status:
                type: string
                enum:
                  - matched
                  - unmatched
                  - invalid
                description: "invalid: not 8, 12, 13 or 14 digits after removing spaces."
              product_id:
                anyOf:
                  - $ref: "#/components/schemas/Id"
                  - type: "null"
              variant_id:
                anyOf:
                  - $ref: "#/components/schemas/Id"
                  - type: "null"
            required:
              - input
              - gtin
              - status
              - product_id
              - variant_id
            additionalProperties: false
            patternProperties:
              ^x-[a-z0-9]+-[a-z0-9_-]+$: true
          description: One result per distinct normalised input, in input order.
        products:
          type: array
          items:
            $ref: "#/components/schemas/ProductDetail"
          description: Each matched product once.
      required:
        - results
        - products
      additionalProperties: false
      patternProperties:
        ^x-[a-z0-9]+-[a-z0-9_-]+$: true
  responses:
    IngestResult:
      description: Operation result.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/IngestResult"
    BadRequest:
      description: "`invalid_request` or `limit_exceeded`."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: "`unauthorized` (not logged in / session expired) or `invalid_credentials`."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: "`forbidden` (wrong role), `csrf_failed`, `account_blocked`, `original_not_allowed`."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: "`not_found`."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: "`conflict`, `setup_required`, `setup_completed`, `gtin_conflict`, `position_conflict`."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    InviteInvalid:
      description: "`invite_invalid` (unknown, used or expired token)."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ValidationFailed:
      description: "`validation_failed` with field errors (or `unsafe_url`)."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    PayloadTooLarge:
      description: "`payload_too_large`."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    UnsupportedMediaType:
      description: "`unsupported_media_type`."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    TooManyRequests:
      description: "`rate_limited`."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
