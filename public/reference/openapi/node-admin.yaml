    delete:
      tags:
        - Portal
      operationId: revokePortalApiClient
      summary: Revoke own client
      parameters:
        - $ref: "#/components/parameters/IdPath"
        - $ref: "#/components/parameters/Csrf"
      responses:
        "204":
          description: Revoked.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: obx_session
  parameters:
    Csrf:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
    IdPath:
      name: id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Id"
    TokenPath:
      name: token
      in: path
      required: true
      schema:
        type: string
        minLength: 20
        maxLength: 200
    ExternalId:
      name: external_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/ExternalId"
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/Cursor"
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Variant:
      name: variant
      in: query
      required: false
      description: Default original when allowed, else web.
      schema:
        type: string
        enum:
          - original
          - web
          - square
    Delimiter:
      name: delimiter
      in: query
      required: false
      description: The UI uses semicolon for Dutch users (Excel), comma otherwise.
      schema:
        type: string
        enum:
          - comma
          - semicolon
        default: comma
  schemas:
    NextCursor:
      description: null on the last page.
      oneOf:
        - $ref: "#/components/schemas/Cursor"
        - type: "null"
    Password:
      type: string
      minLength: 10
      maxLength: 72
      description: 10-72 characters (72 keeps bcrypt-based nodes compatible). Nodes store argon2id or bcrypt hashes only.
    PublicBranding:
      type: object
      required:
        - name
        - languages
        - default_language
        - access_requests_enabled
        - setup_required
      properties:
