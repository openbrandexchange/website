          type: string
        setup_required:
          type: boolean
        user:
          oneOf:
            - $ref: "#/components/schemas/User"
            - type: "null"
        retailer:
          description: For retailer users.
          oneOf:
            - type: object
              required:
                - id
                - name
              properties:
                id:
                  type: string
                name:
                  type: string
            - type: "null"
    Settings:
      type: object
      properties:
        company:
          type: object
          properties:
            name:
              type: string
              minLength: 1
              maxLength: 200
            website:
              type:
                - string
                - "null"
              format: uri
            contact_email:
              oneOf:
                - $ref: "#/components/schemas/Email"
                - type: "null"
            country:
              type:
                - string
                - "null"
              pattern: ^[A-Z]{2}$
        branding:
          type: object
          properties:
            display_name:
              type: string
              minLength: 1
              maxLength: 200
            logo_url:
              type:
                - string
                - "null"
              readOnly: true
              description: Set via PUT /admin/api/settings/logo.
            accent_color:
              type:
                - string
                - "null"
              pattern: ^#[0-9a-fA-F]{6}$
            welcome_text:
              oneOf:
                - $ref: "#/components/schemas/LocalizedText"
                - type: "null"
            portal_name:
              description: 'Overrides the local portal word ("Beeldbank", "Händlerportal" ...) per language; null uses the glossary word. See PublicBranding.portal_name. The settings update is a JSON merge patch (RFC 7396): `{"branding":{"portal_name":{"de":null}}}` removes the German text only, `{"branding":{"portal_name":null}}` removes the whole override. A client that edits the texts as a whole sends `null` for every language it removed.'
              oneOf:
                - $ref: "#/components/schemas/LocalizedText"
                - type: "null"
        portal:
          type: object
          properties:
            access_requests_enabled:
              type: boolean
              default: true
            allow_original_download:
              type: boolean
              default: true
            allow_article_data_export:
              type: boolean
              default: true
            retailer_api_self_service:
              type: boolean
              default: false
            languages:
              type: array
              minItems: 1
              items:
                $ref: "#/components/schemas/LanguageTag"
            default_language:
              $ref: "#/components/schemas/LanguageTag"
        defaults:
          type: object
          properties:
            rights:
              $ref: "#/components/schemas/Rights"
            ingest_status:
              $ref: "#/components/schemas/PublicationStatus"
        node:
          type: object
          readOnly: true
          description: Read-only facts from the node's configuration.
          properties:
            public_url:
              type: string
              format: uri
            discovery_url:
              type: string
              format: uri
            software:
              type: string
            version:
              type: string
            email_configured:
              type: boolean
            renditions_server_generated:
              type: boolean
            max_upload_bytes:
              type: integer
            custom_domain_help:
              type: string
              description: Short hosting-specific instructions for pointing a custom domain at this node (Markdown).
            cron:
              type: object
              description: |
                Only on nodes that need an outside scheduler (ordinary web hosting): what to call
                every few minutes for background work. Absent when the node schedules itself.
              required:
                - url
              properties:
                url:
                  type: string
                  format: uri
                  description: Secret address; calling it runs due background work. Shown to admins only.
                command:
                  type:
                    - string
                    - "null"
                  description: The same as a command line, when the host allows it.
                last_run_at:
                  type:
                    - string
                    - "null"
                  format: date-time
