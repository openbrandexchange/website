openapi: 3.1.0
info:
  title: OBX Ingest API (write side)
  version: 0.2.0
  summary: How a brand's own systems publish content to any OBX node.
  description: |
    **Optional; normative for nodes that offer it** (capability `ingest`). The OBX Protocol
    is the standard; how content gets into a node is up to the node. The OBX Ingest API lets
    a brand's automation (PIM/ERP/DAM connector, spreadsheet export, the `obx` CLI, a GitHub
    Action, n8n/Make/Zapier) publish to ANY conforming node. It is keyed by the brand's own
    ids, so every write is an idempotent upsert: send the same thing twice and nothing changes (and no change entry is written).

    See `docs/ingest.md` for the full semantics, including exactly how writes appear in the
    OBX Protocol `/changes` feed, and `docs/import-format.md` for the canonical CSV and
    image filename pattern.

    Authentication: `Authorization: Bearer <ingest token>` (tokens start with `obxi_`),
    created in the node admin. Scopes: `ingest:read`, `ingest:write`, `ingest:delete`.
    A token MAY be restricted to some brands; writes outside them fail with 403 `forbidden`.

    Errors are `application/problem+json` with `obx_error` (see `docs/protocol.md#errors`).
    Unknown fields in request bodies MUST be ignored by nodes (forward compatibility) and
    reported as a warning in the result.
  license:
    name: CC-BY-4.0
    url: https://creativecommons.org/licenses/by/4.0/
  contact:
    name: Open Brand Exchange
    url: https://openbrandexchange.com
servers:
  - url: https://{host}/obx/v1/ingest
    variables:
      host:
        default: brand.example.org
security:
  - ingestToken: []
tags:
  - name: Info
    description: Token info, limits and rendition requirements.
  - name: Catalog
    description: Idempotent upserts of brands, products, variants and asset metadata, keyed by external id.
  - name: Files
    description: Binary uploads with sha256 dedupe, including resumable multipart uploads.
  - name: Batch
    description: Many operations in one request.
  - name: Imports
    description: Canonical CSV plus images as one job.
  - name: Jobs
    description: Status of asynchronous work.
paths:
  /:
    get:
      tags:
        - Info
      operationId: getIngestInfo
      summary: Token info, limits and rendition requirements
      description: Any scope. Clients SHOULD call this first; `renditions.server_generated=false` means the client must upload web/square/thumb itself.
      responses:
        "200":
          description: Ingest info.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestInfo"
              examples:
                info:
                  summary: Node that needs client-made versions
                  value:
                    token:
                      id: tok_1
                      name: PIM nightly
                      scopes:
                        - ingest:read
                        - ingest:write
                      brand_external_ids: null
                      expires_at: null
                    limits:
                      max_upload_bytes: 104857600
                      max_object_bytes: 2147483648
                      part_bytes: 8388608
                      max_batch_operations: 1000
                      max_import_bytes: 2147483648
                    renditions:
                      server_generated: false
                      required:
                        - original
                        - web
                        - square
                        - thumb
                    accepted_content_types:
                      - image/jpeg
                      - image/png
                      - image/webp
                      - image/tiff
                    default_status: published
                    brands:
                      - external_id: kestrel
                        name: Kestrel
                    languages:
                      - nl
                      - en
        "401":
          $ref: "#/components/responses/Unauthorized"
  /brands/{external_id}:
    parameters:
      - $ref: "#/components/parameters/ExternalId"
    get:
      tags:
        - Catalog
      operationId: getIngestBrand
      summary: Read a brand
      responses:
        "200":
          $ref: "#/components/responses/Record"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags:
        - Catalog
      operationId: putIngestBrand
      summary: Create or replace a brand
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BrandInput"
            examples:
              brand:
                summary: A brand
                value:
                  name: Kestrel Trail
                  website: https://kestrel.example/trail
                  description:
                    en: Trail running gear.
                    nl: Trailrunningkleding.
      responses:
        "200":
          $ref: "#/components/responses/Result"
        "201":
          $ref: "#/components/responses/ResultCreated"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    patch:
      tags:
        - Catalog
      operationId: patchIngestBrand
      summary: Partially update a brand (JSON merge patch)
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              type: object
      responses:
        "200":
          $ref: "#/components/responses/Result"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "422":
          $ref: "#/components/responses/ValidationFailed"
    delete:
      tags:
        - Catalog
      operationId: deleteIngestBrand
      summary: Delete a brand
      description: "Requires scope ingest:delete. Fails with 409 `conflict` while the brand still has products (delete or move them first). Idempotent: deleting an unknown id returns 200 with result `unchanged`."
      responses:
        "200":
          $ref: "#/components/responses/Result"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /products/{external_id}:
    parameters:
      - $ref: "#/components/parameters/ExternalId"
    get:
      tags:
        - Catalog
      operationId: getIngestProduct
      summary: Read a product
      responses:
        "200":
          $ref: "#/components/responses/Record"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags:
        - Catalog
      operationId: putIngestProduct
      summary: Create or replace a product
      description: |
        Full replacement: omitted optional fields become null. Exception: an omitted `status`
        keeps the current status (new objects get the node's default status, normally
        `published`), so a nightly sync never re-publishes what someone unpublished by hand
        unless it sends `status` explicitly.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
            examples:
              minimal:
                summary: A minimal product
                value:
                  style_number: KO-1007
                  name:
                    en: Linen Shirt
              luggage:
                summary: A suitcase with subtype, composition and features
                value:
                  brand_external_id: kestrel
                  style_number: KO-1008
                  name:
                    en: Hardshell Cabin Spinner
                    nl: Harde handbagagekoffer
                  item_type: luggage
                  item_subtype: cabin
                  target_group: unisex
                  materials:
                    - part: shell
                      fibers:
                        - fiber: polypropylene
                          percentage: 100
                    - part: lining
                      fibers:
                        - fiber: polyester
                          percentage: 100
                          recycled: true
                  contains_animal_origin: null
                  footwear_materials: null
                  country_of_origin: CN
                  certifications: null
                  features:
                    shell: hard
                    wheels: 4
                    lock: tsa_combination
                    expandable: true
                    closure: zip
      responses:
        "200":
          $ref: "#/components/responses/Result"
        "201":
          $ref: "#/components/responses/ResultCreated"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    patch:
      tags:
        - Catalog
      operationId: patchIngestProduct
      summary: Partially update a product (JSON merge patch), e.g. to unpublish
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              type: object
      responses:
        "200":
          $ref: "#/components/responses/Result"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "422":
          $ref: "#/components/responses/ValidationFailed"
    delete:
      tags:
        - Catalog
      operationId: deleteIngestProduct
      summary: Delete a product with its variants and assets
      description: Requires ingest:delete. Emits tombstones for the product and each of its visible variants and assets. Idempotent.
      responses:
        "200":
          $ref: "#/components/responses/Result"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /products/{external_id}/asset-order:
    put:
      tags:
        - Catalog
      operationId: putIngestAssetOrder
      summary: Set the image order of one product colour atomically
      description: |
        Assigns positions 1..n to the listed assets (all non-deleted assets of this product
        and `color_code` MUST be listed; 422 `validation_failed` otherwise). This is how you
        swap or reorder images without `position_conflict`. Emits one asset upsert per asset
        whose position changed.
      parameters:
        - $ref: "#/components/parameters/ExternalId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - color_code
                - asset_external_ids
              properties:
                color_code:
                  type:
                    - string
                    - "null"
                  description: null = the product-wide (all colours) assets.
                asset_external_ids:
                  type: array
                  minItems: 1
                  maxItems: 999
                  uniqueItems: true
                  items:
                    $ref: "#/components/schemas/ExternalId"
      responses:
        "200":
          description: One result per listed asset.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/IngestResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /variants/{external_id}:
    parameters:
      - $ref: "#/components/parameters/ExternalId"
    get:
      tags:
        - Catalog
      operationId: getIngestVariant
      summary: Read a variant
      responses:
        "200":
          $ref: "#/components/responses/Record"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags:
        - Catalog
      operationId: putIngestVariant
      summary: Create or replace a variant
      description: The product (`product_external_id`) MUST exist, else 422 `unknown_parent`. GTIN check digit MUST be valid (`invalid_gtin`) and unique in the node (409 `gtin_conflict`).
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VariantInput"
            examples:
              variant:
                summary: A size with EAN
                value:
                  product_external_id: KO-1007
                  gtin: "2000100701010"
                  color:
                    code: SND
                    name:
                      en: Sand
                  size: M
                  size_system: INT
              measurements:
                summary: A suitcase size with measurements and colour family
                value:
                  product_external_id: KO-1008
                  gtin: "2000100801017"
                  sku: KO-1008-BLK-CABIN
                  color:
                    code: BLK
                    name:
                      en: Black
                      nl: Zwart
                    family: black
                  size: CABIN
                  measurements:
                    height_cm: 55
                    width_cm: 40
                    depth_cm: 20
                    weight_kg: 2.6
                    volume_l: 36
                    volume_expanded_l: 42
      responses:
        "200":
          $ref: "#/components/responses/Result"
        "201":
          $ref: "#/components/responses/ResultCreated"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    patch:
      tags:
        - Catalog
      operationId: patchIngestVariant
      summary: Partially update a variant (JSON merge patch)
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              type: object
      responses:
        "200":
          $ref: "#/components/responses/Result"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
    delete:
      tags:
        - Catalog
      operationId: deleteIngestVariant
      summary: Delete a variant
      responses:
        "200":
          $ref: "#/components/responses/Result"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /assets/{external_id}:
    parameters:
      - $ref: "#/components/parameters/ExternalId"
    get:
      tags:
        - Catalog
      operationId: getIngestAsset
      summary: Read asset metadata (including missing_files)
      responses:
        "200":
          $ref: "#/components/responses/Record"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags:
        - Catalog
      operationId: putIngestAsset
      summary: Create or replace asset metadata
      description: |
        The product MUST exist (`unknown_parent`). `position` MUST be free among the product's
        other non-deleted assets of the same `color_code` (409 `position_conflict`; replacing an
        image = reuse its external_id). `files` attaches blobs uploaded earlier (422
        `blob_missing` if a sha256 is unknown); this is the atomic way to replace an original
        together with client-generated renditions. The asset becomes visible once its original
        and all required renditions exist (`visibility: pending_files` until then).
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssetInput"
            examples:
              client:
                summary: Image with client-made versions
                value:
                  product_external_id: KO-1007
                  color_code: SND
                  role: packshot
                  view: front
                  position: 1
                  rights:
                    channels:
                      - webshop
                    embargo_until: 2027-02-01T00:00:00Z
                  provenance:
                    ai_generated: false
                    ai_edited: true
                    source: composite
                  files:
                    original:
                      sha256: "6666666666666666666666666666666666666666666666666666666666666666"
                    web:
                      sha256: "7777777777777777777777777777777777777777777777777777777777777777"
                      width: 1600
                      height: 2000
                    square:
                      sha256: "8888888888888888888888888888888888888888888888888888888888888888"
                      width: 2000
                      height: 2000
                    thumb:
                      sha256: "9999999999999999999999999999999999999999999999999999999999999999"
                      width: 480
                      height: 600
      responses:
        "200":
          $ref: "#/components/responses/Result"
        "201":
          $ref: "#/components/responses/ResultCreated"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    patch:
      tags:
        - Catalog
      operationId: patchIngestAsset
      summary: Partially update asset metadata (JSON merge patch)
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              type: object
      responses:
        "200":
          $ref: "#/components/responses/Result"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
    delete:
      tags:
        - Catalog
      operationId: deleteIngestAsset
      summary: Delete an asset
      responses:
        "200":
          $ref: "#/components/responses/Result"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /assets/{external_id}/files/{rendition}:
    put:
      tags:
        - Files
      operationId: putIngestAssetFile
      summary: Upload the original or a client-generated rendition
      description: |
        Raw body, `Content-Type` of the file. `OBX-Content-SHA256` is RECOMMENDED; when present
        the node verifies it (422 `checksum_mismatch`). The asset metadata MUST exist (404).
        Uploading the same bytes again is a no-op (`unchanged`).

        Replacing `original` on a node without server-side renditions: the node keeps serving
        the previous original and renditions until all required renditions uploaded AFTER the
        new original are present, then swaps atomically (one asset upsert in /changes).
        Renditions MUST follow the rendition rules (web/thumb: JPEG, longest side <= 2000/600,
        never upscaled; square: web on a white square canvas); nodes MAY reject (422
        `validation_failed`) renditions whose size violates them.
      parameters:
        - $ref: "#/components/parameters/ExternalId"
        - name: rendition
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/RenditionName"
        - $ref: "#/components/parameters/ContentSha256"
      requestBody:
        required: true
        content:
          image/*:
            schema:
              type: string
              contentMediaType: application/octet-stream
      responses:
        "200":
          $ref: "#/components/responses/Result"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /blobs/{sha256}:
    parameters:
      - name: sha256
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/Sha256"
    head:
      tags:
        - Files
      operationId: headIngestBlob
      summary: Does the node already have these bytes?
      description: Dedupe check before uploading. 200 = present (skip the upload), 404 = upload it.
      responses:
        "200":
          description: Present.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Not present.
    put:
      tags:
        - Files
      operationId: putIngestBlob
      summary: Upload bytes (content-addressed)
      description: Raw body. The node verifies the sha256 (422 `checksum_mismatch`). Blobs not referenced by any asset MAY be garbage-collected after 24 h. Bodies larger than `limits.max_upload_bytes` use /uploads.
      requestBody:
        required: true
        content:
          image/*:
            schema:
              type: string
              contentMediaType: application/octet-stream
      responses:
        "200":
          description: Already present (created=false).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Blob"
              examples:
                blob:
                  summary: Stored blob
                  value:
                    sha256: "3333333333333333333333333333333333333333333333333333333333333333"
                    bytes: 48211
                    content_type: image/jpeg
                    width: 1200
                    height: 1500
                    created: true
        "201":
          description: Stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Blob"
              examples:
                blob:
                  summary: Stored blob
                  value:
                    sha256: "3333333333333333333333333333333333333333333333333333333333333333"
                    bytes: 48211
                    content_type: image/jpeg
                    width: 1200
                    height: 1500
                    created: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /uploads:
    post:
      tags:
        - Files
      operationId: createUpload
      summary: Start a resumable multipart upload
      description: For files above `max_upload_bytes`. If the node already has the sha256 it answers 200 with the Blob and no upload is needed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - sha256
                - bytes
                - content_type
              properties:
                sha256:
                  $ref: "#/components/schemas/Sha256"
                bytes:
                  type: integer
                  minimum: 1
                content_type:
                  type: string
      responses:
        "200":
          description: Blob already present.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Blob"
              examples:
                blob:
                  summary: Stored blob
                  value:
                    sha256: "3333333333333333333333333333333333333333333333333333333333333333"
                    bytes: 48211
                    content_type: image/jpeg
                    width: 1200
                    height: 1500
                    created: true
        "201":
          description: Upload session created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Upload"
              examples:
                upload:
                  summary: Multipart upload in progress
                  value:
                    id: upl_1
                    sha256: "4444444444444444444444444444444444444444444444444444444444444444"
                    bytes: 83886080
                    content_type: image/tiff
                    part_bytes: 8388608
                    parts_total: 10
                    received_parts:
                      - 1
                      - 2
                      - 3
                    status: open
                    expires_at: 2026-09-29T10:00:00Z
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
  /uploads/{id}:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    get:
      tags:
        - Files
      operationId: getUpload
      summary: Upload status (which parts arrived)
      responses:
        "200":
          description: Upload session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Upload"
              examples:
                upload:
                  summary: Multipart upload in progress
                  value:
                    id: upl_1
                    sha256: "4444444444444444444444444444444444444444444444444444444444444444"
                    bytes: 83886080
                    content_type: image/tiff
                    part_bytes: 8388608
                    parts_total: 10
                    received_parts:
                      - 1
                      - 2
                      - 3
                    status: open
                    expires_at: 2026-09-29T10:00:00Z
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags:
        - Files
      operationId: abortUpload
      summary: Abort an upload
      responses:
        "204":
          description: Aborted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /uploads/{id}/parts/{number}:
    put:
      tags:
        - Files
      operationId: putUploadPart
      summary: Upload one part
      description: Idempotent per part number; re-sending a part replaces it. Every part except the last MUST be exactly `part_bytes`.
      parameters:
        - $ref: "#/components/parameters/IdPath"
        - name: number
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              contentMediaType: application/octet-stream
      responses:
        "200":
          description: Part stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Upload"
              examples:
                upload:
                  summary: Multipart upload in progress
                  value:
                    id: upl_1
                    sha256: "4444444444444444444444444444444444444444444444444444444444444444"
                    bytes: 83886080
                    content_type: image/tiff
                    part_bytes: 8388608
                    parts_total: 10
                    received_parts:
                      - 1
                      - 2
                      - 3
                    status: open
                    expires_at: 2026-09-29T10:00:00Z
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /uploads/{id}/complete:
    post:
      tags:
        - Files
      operationId: completeUpload
      summary: Assemble the parts into a blob
      description: Verifies size and sha256. Missing parts give 409 `upload_incomplete`; a hash mismatch gives 422 `checksum_mismatch` (the upload is aborted).
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: The blob.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Blob"
              examples:
                blob:
                  summary: Stored blob
                  value:
                    sha256: "3333333333333333333333333333333333333333333333333333333333333333"
                    bytes: 48211
                    content_type: image/jpeg
                    width: 1200
                    height: 1500
                    created: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /batch:
    post:
      tags:
        - Batch
      operationId: postIngestBatch
      summary: Many operations in one request
      description: |
        Up to `limits.max_batch_operations` (>= 1000) operations, processed in order, each one
        atomic on its own; a failing operation does not stop the rest. Body: a JSON array of
        IngestOperation, or NDJSON (one operation per line). Binary data is referenced by
        sha256 (upload blobs first). The node answers 200 with all results when it processed
        the batch within the request, or 202 with a job (always when the client sends
        `Prefer: respond-async`). Clients MUST handle both.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: Prefer
          in: header
          required: false
          schema:
            type: string
            enum:
              - respond-async
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              maxItems: 1000
              items:
                $ref: "#/components/schemas/IngestOperation"
          application/x-ndjson:
            schema:
              $ref: "#/components/schemas/IngestOperation"
      responses:
        "200":
          description: Processed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchResponse"
        "202":
          description: Accepted as a job.
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestJob"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /imports:
    post:
      tags:
        - Imports
      operationId: postIngestImport
      summary: Import a canonical CSV and/or images as one job
      description: |
        multipart/form-data with any of: `package` (zip with products.csv, optional assets.csv
        and images), `csv` (products.csv), `assets_csv` (assets.csv), `images` (one zip, or
        repeated image files), `images_manifest` (JSON: images already uploaded as blobs,
        referenced by file name + sha256, optionally with client-generated renditions) and
        `options` (JSON). The manifest is how the `obx` CLI and the admin UI avoid re-uploading
        unchanged images: HEAD /blobs/{sha256}, upload only what is missing, then import with
        the manifest. Always asynchronous: 202 + job. Row and file problems are reported as
        ImportRowError results, never as a failed request. See docs/import-format.md.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                package:
                  type: string
                  contentMediaType: application/zip
                csv:
                  type: string
                  contentMediaType: text/csv
                assets_csv:
                  type: string
                  contentMediaType: text/csv
                images:
                  type: array
                  items:
                    type: string
                    contentMediaType: application/octet-stream
                images_manifest:
                  $ref: "#/components/schemas/ImagesManifest"
                options:
                  $ref: "#/components/schemas/ImportOptions"
            encoding:
              options:
                contentType: application/json
              images_manifest:
                contentType: application/json
      responses:
        "202":
          description: Import job queued.
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestJob"
              examples:
                import:
                  summary: Import job
                  value:
                    id: job_1
                    kind: import
                    status: succeeded
                    created_at: 2026-09-28T10:00:00Z
                    finished_at: 2026-09-28T10:00:00Z
                    progress:
                      done: 67
                      total: 67
                    summary:
                      created: 75
                      updated: 0
                      unchanged: 0
                      deleted: 0
                      errors: 1
                    import_run:
                      id: run_1
