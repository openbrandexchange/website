                      mode: upsert
                      dry_run: false
                      created_at: 2026-09-28T10:00:00Z
                      started_at: 2026-09-28T10:00:00Z
                      finished_at: 2026-09-28T10:00:00Z
                      files:
                        - name: products.csv
                          bytes: 10240
                          sha256: "5555555555555555555555555555555555555555555555555555555555555555"
                      counts:
                        rows: 40
                        files: 27
                        created: 75
                        updated: 0
                        unchanged: 0
                        unpublished: 0
                        errors: 1
