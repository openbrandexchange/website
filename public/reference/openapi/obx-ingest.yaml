components:
  securitySchemes:
    ingestToken:
      type: http
      scheme: bearer
      description: Brand ingest token (obxi_...), created and revoked in the node admin.
  parameters:
    ExternalId:
      name: external_id
      in: path
      required: true
      description: The brand's own id, percent-encoded.
      schema:
        $ref: "#/components/schemas/ExternalId"
    IdPath:
      name: id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Id"
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/Cursor"
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: Optional optimistic concurrency with the record's ETag.
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Repeating a request with the same key within 24 h returns the original response (same job).
      schema:
        type: string
        maxLength: 200
    ContentSha256:
      name: OBX-Content-SHA256
      in: header
      required: false
      description: Lowercase hex sha256 of the body; verified when present.
      schema:
        $ref: "#/components/schemas/Sha256"
  schemas:
    BatchResponse:
      type: object
      required:
        - results
        - summary
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/IngestResult"
        summary:
          type: object
          required:
            - created
            - updated
            - unchanged
            - deleted
            - errors
          properties:
            created:
              type: integer
              minimum: 0
            updated:
              type: integer
              minimum: 0
            unchanged:
              type: integer
              minimum: 0
            deleted:
              type: integer
              minimum: 0
            errors:
              type: integer
              minimum: 0
    ImagesManifest:
      type: array
      maxItems: 100000
      description: Images already uploaded as blobs. `file` is the image file name the canonical filename pattern and assets.csv refer to. Unknown sha256 -> row error `blob_missing`.
      items:
        type: object
        required:
          - file
          - sha256
        properties:
          file:
            type: string
            maxLength: 255
          sha256:
            $ref: "#/components/schemas/Sha256"
          width:
            type: integer
            minimum: 1
          height:
            type: integer
            minimum: 1
          renditions:
            type: object
            description: Client-generated renditions (required on nodes without server-side renditions).
            additionalProperties: false
            properties:
              web:
                $ref: "#/components/schemas/BlobRef"
              square:
                $ref: "#/components/schemas/BlobRef"
              thumb:
                $ref: "#/components/schemas/BlobRef"
    BlobRef:
      type: object
      required:
        - sha256
        - width
        - height
      properties:
        sha256:
          $ref: "#/components/schemas/Sha256"
        width:
          type: integer
          minimum: 1
        height:
          type: integer
          minimum: 1
    ImportOptions:
      type: object
      properties:
        mode:
          type: string
          enum:
            - upsert
            - mirror
          default: upsert
          description: mirror also unpublishes products of the brands present in the file that the file does not contain.
        allow_mass_unpublish:
          type: boolean
          default: false
          description: Without it a mirror import that would unpublish more than half of those products fails with mass_unpublish_refused.
        dry_run:
          type: boolean
          default: false
          description: Validate and report only; write nothing.
        default_language:
          description: Language of un-suffixed text columns (name, description, color_name). Default = the node's first language.
          $ref: "#/components/schemas/LanguageTag"
    Id:
      type: string
      description: Opaque, node-assigned identifier. Stable for the life of the object. Consumers MUST treat it as opaque.
      pattern: ^[A-Za-z0-9][A-Za-z0-9._~-]{0,127}$
      examples:
        - prd_01J9ZK3Q7T5W
    IngestScope:
      type: string
      enum:
        - ingest:read
        - ingest:write
        - ingest:delete
      description: OBX Ingest token scope.
    ExternalId:
      type: string
      description: The brand's own identifier for an object (from its PIM/ERP/spreadsheet). 1-200 characters, no control characters and no '/'. Leading/trailing whitespace is trimmed by nodes. Compared case-sensitively.
      minLength: 1
      maxLength: 200
      pattern: ^[^\x00-\x1F\x7F/]+$
      examples:
        - KO-1001
    DateTime:
      type: string
      description: RFC 3339 timestamp, UTC recommended.
      format: date-time
      examples:
        - 2026-09-28T10:00:00Z
    RenditionName:
      type: string
      enum:
        - original
        - web
        - square
        - thumb
      description: Rendition name.
    PublicationStatus:
      type: string
      enum:
        - published
        - unpublished
      description: Brand-side publication state. Only 'published' objects (with published parents) are visible through the OBX Protocol.
    LanguageTag:
      type: string
      description: BCP 47 language tag, restricted to language or language-REGION.
      pattern: ^[a-z]{2,3}(-[A-Z]{2})?$
      examples:
        - nl
        - en
        - de-CH
    IngestInfo:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: https://openbrandexchange.com/schemas/v0.2/IngestInfo.json
      type: object
      title: IngestInfo
      description: "GET /obx/v1/ingest: who am I, limits, and whether clients must generate renditions."
      properties:
        token:
          type: object
          properties:
            id:
              $ref: "#/components/schemas/Id"
            name:
              type: string
            scopes:
              type: array
              items:
                $ref: "#/components/schemas/IngestScope"
            brand_external_ids:
              type:
                - array
                - "null"
              items:
                $ref: "#/components/schemas/ExternalId"
              description: Restriction; null = all brands.
            expires_at:
              anyOf:
                - $ref: "#/components/schemas/DateTime"
                - type: "null"
          required:
            - id
            - name
            - scopes
            - brand_external_ids
            - expires_at
          additionalProperties: false
          patternProperties:
            ^x-[a-z0-9]+-[a-z0-9_-]+$: true
        limits:
          type: object
          properties:
            max_upload_bytes:
              type: integer
              description: Largest single-request body (blob/file upload).
              minimum: 26214400
            max_object_bytes:
              type: integer
              description: Largest original via multipart upload.
              minimum: 524288000
            part_bytes:
              type: integer
              minimum: 5242880
            max_batch_operations:
              type: integer
              minimum: 1000
            max_import_bytes:
              type: integer
              minimum: 524288000
          required:
            - max_upload_bytes
            - max_object_bytes
            - part_bytes
            - max_batch_operations
            - max_import_bytes
          additionalProperties: false
          patternProperties:
            ^x-[a-z0-9]+-[a-z0-9_-]+$: true
        renditions:
          type: object
          properties:
            server_generated:
              type: boolean
              description: "true: the node renders web/square/thumb itself. false: clients MUST upload them (admin UI and obx CLI do this automatically)."
            required:
              type: array
              items:
                $ref: "#/components/schemas/RenditionName"
          required:
            - server_generated
            - required
          additionalProperties: false
          patternProperties:
            ^x-[a-z0-9]+-[a-z0-9_-]+$: true
        accepted_content_types:
          type: array
          items:
            type: string
          description: Original media types accepted, at least image/jpeg, image/png, image/webp.
        default_status:
          $ref: "#/components/schemas/PublicationStatus"
        brands:
          type: array
          items:
            type: object
            properties:
              external_id:
                $ref: "#/components/schemas/ExternalId"
              name:
                type: string
            required:
              - external_id
              - name
            additionalProperties: false
            patternProperties:
              ^x-[a-z0-9]+-[a-z0-9_-]+$: true
        languages:
          type: array
          items:
            $ref: "#/components/schemas/LanguageTag"
          minItems: 1
      required:
        - token
        - limits
        - renditions
        - accepted_content_types
        - default_status
        - brands
        - languages
      additionalProperties: false
      patternProperties:
        ^x-[a-z0-9]+-[a-z0-9_-]+$: true
    ErrorCode:
      type: string
      enum:
        - invalid_request
        - validation_failed
        - unauthorized
        - invalid_token
        - access_revoked
        - insufficient_scope
        - forbidden
        - not_found
        - method_not_allowed
        - conflict
        - precondition_failed
        - payload_too_large
        - unsupported_media_type
        - rate_limited
        - limit_exceeded
        - cursor_invalid
        - cursor_expired
        - export_expired
        - original_not_allowed
        - invalid_gtin
        - gtin_conflict
        - position_conflict
        - checksum_mismatch
        - blob_missing
        - upload_incomplete
        - unknown_parent
        - files_missing
        - import_invalid
        - mass_unpublish_refused
        - workbook_invalid
        - workbook_unsafe
        - workbook_sheet_missing
        - workbook_too_large
        - unsafe_url
        - csrf_failed
        - invalid_credentials
        - account_blocked
        - setup_required
        - setup_completed
        - invite_invalid
        - not_implemented
        - internal_error
        - service_unavailable
      description: Machine-readable OBX error code (see docs/protocol.md#errors). Clients MUST treat unknown codes by HTTP status.
    Problem:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: https://openbrandexchange.com/schemas/v0.2/Problem.json
      type: object
      title: Problem
      description: "application/problem+json (RFC 9457) error body. Exception: the OAuth2 token endpoint uses RFC 6749 error JSON."
      properties:
        type:
          type: string
          description: "URI identifying the problem type: `https://openbrandexchange.com/errors/<obx_error>`."
          format: uri
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type:
            - string
            - "null"
        instance:
          type:
            - string
            - "null"
        obx_error:
          $ref: "#/components/schemas/ErrorCode"
        errors:
          type: array
          items:
            type: object
            properties:
              pointer:
                type:
                  - string
                  - "null"
                description: JSON Pointer (RFC 6901) into the request body, or a CSV locator like 'row:12/gtin'.
              obx_error:
                $ref: "#/components/schemas/ErrorCode"
              detail:
                type: string
            required:
              - obx_error
              - detail
            additionalProperties: false
            patternProperties:
              ^x-[a-z0-9]+-[a-z0-9_-]+$: true
          description: Field-level errors (validation_failed).
        retry_after:
          type:
            - integer
            - "null"
          description: Seconds; mirrors Retry-After.
          minimum: 0
      required:
        - type
        - title
        - status
        - obx_error
      additionalProperties: false
      patternProperties:
        ^x-[a-z0-9]+-[a-z0-9_-]+$: true
    IngestRecord:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: https://openbrandexchange.com/schemas/v0.2/IngestRecord.json
      type: object
      title: IngestRecord
      description: GET representation in the Ingest API (and the admin catalog).
      properties:
        kind:
          type: string
          enum:
            - brand
            - product
            - variant
            - asset
        id:
          $ref: "#/components/schemas/Id"
        external_id:
          $ref: "#/components/schemas/ExternalId"
        status:
          $ref: "#/components/schemas/PublicationStatus"
        visibility:
          type: string
          enum:
            - visible
            - hidden
            - pending_files
        etag:
          type: string
        created_at:
          $ref: "#/components/schemas/DateTime"
        updated_at:
          $ref: "#/components/schemas/DateTime"
        data:
          type: object
          description: "The stored write model (BrandInput/ProductInput/VariantInput/AssetInput) with defaults applied. For assets: `rights` is the full effective Rights object (node default rights merged with the fields the brand sent), `provenance` the full Provenance with its defaults, and `files` lists every current blob (original and web/square/thumb, including renditions the node made itself) with sha256, width and height."
        missing_files:
          type:
            - array
            - "null"
          items:
            $ref: "#/components/schemas/RenditionName"
          description: Present for assets only (an empty array when nothing is missing); omitted for brands, products and variants. Files still required before the asset becomes visible.
      required:
        - kind
        - id
        - external_id
        - status
        - visibility
        - etag
        - created_at
        - updated_at
        - data
      additionalProperties: false
      patternProperties:
        ^x-[a-z0-9]+-[a-z0-9_-]+$: true
    Url:
      type: string
      description: Absolute http(s) URL.
      format: uri
      pattern: ^https?://
      maxLength: 2048
    LocalizedText:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: https://openbrandexchange.com/schemas/v0.2/LocalizedText.json
      title: LocalizedText
      description: 'Free text per language, keyed by BCP 47 tag. At least one language. Example: {"nl": "Trui", "en": "Sweater"}.'
      type: object
      minProperties: 1
      patternProperties:
        ^[a-z]{2,3}(-[A-Z]{2})?$:
          type: string
          minLength: 1
          maxLength: 20000
      additionalProperties: false
    BrandInput:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: https://openbrandexchange.com/schemas/v0.2/BrandInput.json
      type: object
      title: BrandInput
      description: "Ingest write model for a brand. Key: the brand's external_id (path)."
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        logo_url:
          anyOf:
            - $ref: "#/components/schemas/Url"
              description: Fetched by the node once (SSRF-protected) or null.
            - type: "null"
        website:
          anyOf:
            - $ref: "#/components/schemas/Url"
            - type: "null"
        description:
          anyOf:
            - $ref: "#/components/schemas/LocalizedText"
            - type: "null"
        status:
          $ref: "#/components/schemas/PublicationStatus"
      required:
        - name
      additionalProperties: false
      patternProperties:
        ^x-[a-z0-9]+-[a-z0-9_-]+$: true
    WarningCode:
      type: string
      enum:
        - fibre_composition_missing
        - animal_origin_unknown
        - footwear_materials_missing
        - fibre_percentages_not_100
      description: Label completeness warning (see docs/import-format.md#label-completeness). Never blocks a write or publishing. Clients MUST ignore unknown codes.
    IngestResult:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: https://openbrandexchange.com/schemas/v0.2/IngestResult.json
      type: object
      title: IngestResult
      properties:
        index:
          type:
            - integer
            - "null"
          description: 0-based position in the batch (batch only).
          minimum: 0
        op:
          type: string
          enum:
            - upsert
            - patch
            - delete
            - publish
            - unpublish
        kind:
          type: string
          enum:
            - brand
            - product
            - variant
            - asset
        external_id:
          $ref: "#/components/schemas/ExternalId"
        result:
          type: string
          enum:
            - created
            - updated
            - unchanged
            - deleted
            - error
          description: "unchanged: the stored representation is identical; no change entry was written."
        id:
          anyOf:
            - $ref: "#/components/schemas/Id"
              description: Protocol id of the object (null on error before creation).
            - type: "null"
        visibility:
          type:
            - string
            - "null"
          enum:
            - visible
            - hidden
            - pending_files
            - null
          description: "visible: served by the protocol. hidden: unpublished or a parent is hidden/missing. pending_files: asset waiting for its original or required renditions."
        etag:
          type:
            - string
            - "null"
        error:
          anyOf:
            - $ref: "#/components/schemas/Problem"
            - type: "null"
        warnings:
          type: array
          items:
            type: string
            maxLength: 1000
        warning_details:
          type: array
          description: Warnings with a stable code (label completeness, docs/import-format.md#label-completeness). Each is also listed as text in warnings. Present only when there are any.
          items:
            type: object
            properties:
              code:
                $ref: "#/components/schemas/WarningCode"
              pointer:
                type:
                  - string
                  - "null"
                description: JSON Pointer into the write model, e.g. /materials/0.
                maxLength: 500
              detail:
                type: string
                maxLength: 1000
            required:
              - code
              - detail
            additionalProperties: false
            patternProperties:
              ^x-[a-z0-9]+-[a-z0-9_-]+$: true
      required:
        - op
        - kind
        - external_id
        - result
      additionalProperties: false
      patternProperties:
        ^x-[a-z0-9]+-[a-z0-9_-]+$: true
    Materials:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: https://openbrandexchange.com/schemas/v0.2/Materials.json
      type: array
      items:
        type: object
        properties:
          part:
            type: string
            description: "Part of the article. Recommended keys: main, outer, lining, filling, padding, trim, pocket_lining, shell (luggage), handle, strap, and for footwear upper, sole, insole. 'main' when the product has one composition. Unknown keys are allowed."
            pattern: ^[a-z][a-z0-9_]{0,63}$
            examples:
              - main
          fibers:
            type: array
            items:
              type: object
              properties:
                fiber:
                  type: string
                  description: "Fibre key: the English textile fibre name of Annex I of Reg. (EU) 1007/2011 in lowercase with _ (linen for flax), e.g. cotton, wool, polyester, polyamide, elastane, viscose, lyocell; recommended list in docs/import-format.md#fibres. Recycled or organic content is a flag, not a fibre: the 0.1 keys `recycled_*` and `organic_*` (e.g. recycled_polyester, organic_cotton) are accepted on input and normalised to the fibre with recycled or organic set."
                  pattern: ^[a-z][a-z0-9_]{0,63}$
                percentage:
                  type: number
                  exclusiveMinimum: 0
                  maximum: 100
                recycled:
                  type: boolean
                  description: The fibre is recycled. Present only when true.
                organic:
                  type: boolean
                  description: The fibre is organically grown. Present only when true.
              required:
                - fiber
                - percentage
              additionalProperties: false
              patternProperties:
                ^x-[a-z0-9]+-[a-z0-9_-]+$: true
            minItems: 1
            description: Percentages of one part SHOULD sum to 100.
        required:
          - part
          - fibers
        additionalProperties: false
        patternProperties:
          ^x-[a-z0-9]+-[a-z0-9_-]+$: true
      title: Materials
      description: Fibre composition per part (textile labelling regulation / DPP ready).
    FootwearMaterials:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: https://openbrandexchange.com/schemas/v0.2/FootwearMaterials.json
      title: FootwearMaterials
      description: "Footwear labelling (Directive 94/11/EC): the material of the three parts of a shoe, in the directive's four categories. The value is the material that makes up at least 80 % of the surface of the upper and of the lining and sock, and at least 80 % of the volume of the outer sole. Responses include all three parts; null = not stated."
      type: object
      properties:
        upper:
          anyOf:
            - type: string
              enum:
                - leather
                - coated_leather
                - textile
                - other
              description: "Upper: the outer face of the structural element attached to the outer sole."
            - type: "null"
        lining_and_sock:
          anyOf:
            - type: string
              enum:
                - leather
                - coated_leather
                - textile
                - other
              description: "Lining and sock: the lining of the upper and the sock (insole) that form the inside of the shoe."
            - type: "null"
        outer_sole:
          anyOf:
            - type: string
              enum:
                - leather
                - coated_leather
                - textile
                - other
              description: "Outer sole: the bottom part that touches the ground and is attached to the upper."
            - type: "null"
      additionalProperties: false
      patternProperties:
        ^x-[a-z0-9]+-[a-z0-9_-]+$: true
    Care:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: https://openbrandexchange.com/schemas/v0.2/Care.json
      type: array
      items:
        type: object
        properties:
          code:
            type: string
            description: Care instruction key, ISO 3758 aligned (recommended list in docs/import-format.md#care-codes), e.g. wash_30, do_not_bleach, tumble_dry_low, iron_low, dry_clean_p, do_not_dry_clean.
            pattern: ^[a-z][a-z0-9_]{0,63}$
          text:
            anyOf:
              - $ref: "#/components/schemas/LocalizedText"
              - type: "null"
        required:
          - code
        additionalProperties: false
        patternProperties:
          ^x-[a-z0-9]+-[a-z0-9_-]+$: true
      title: Care
      description: Ordered care instructions.
    CountryCode:
      type: string
      description: ISO 3166-1 alpha-2 country code.
      pattern: ^[A-Z]{2}$
      examples:
        - NL
    Certifications:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: https://openbrandexchange.com/schemas/v0.2/Certifications.json
      title: Certifications
      description: Voluntary certifications the brand states for this product (private schemes, not legal requirements). The node passes them on as stated; checking a licence is up to the reader.
      type: array
      items:
        type: object
        properties:
          scheme:
            type: string
            description: "Open vocabulary; recommended: gots, ocs, grs, rcs, oeko_tex_standard_100, oeko_tex_made_in_green, bluesign, fsc, lwg, rws, rds."
            pattern: ^[a-z][a-z0-9_]{0,63}$
          licence_number:
            type:
              - string
              - "null"
            description: The licence, certificate or label number as issued by the scheme.
            minLength: 1
            maxLength: 200
          scope:
            type: string
            enum:
              - product
              - material
            description: "product: the finished product is certified; material: a material in it is (the product itself is not)."
        required:
          - scheme
          - scope
        additionalProperties: false
        patternProperties:
          ^x-[a-z0-9]+-[a-z0-9_-]+$: true
    Features:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: https://openbrandexchange.com/schemas/v0.2/Features.json
      title: Features
      description: Typed product features from the registry in docs/protocol.md#features. Keys of the registry have the type and values listed there; other keys (same key pattern) are allowed and not validated. Only stated features are present; null instead of an empty object.
      type: object
      properties:
        shell:
          type: string
          enum:
            - hard
            - soft
            - hybrid
          description: "Luggage: construction of the shell."
        wheels:
          type: integer
          enum:
            - 0
            - 2
            - 4
            - 8
          description: "Luggage: number of wheels."
        lock:
          type: string
          enum:
            - none
            - combination
            - tsa_combination
            - tsa_key
            - key
          description: "Luggage, bags: built-in lock."
        expandable:
          type: boolean
          description: "Luggage, bags: has an expansion zip (volume in measurements.volume_expanded_l)."
        closure:
          type: string
          enum:
            - zip
            - magnet
            - flap
            - buckle
            - drawstring
            - button
            - hook_and_loop
            - laces
            - slip_on
            - open
          description: "Bags, shoes, apparel: main closure."
        laptop_compartment:
          type: boolean
          description: "Bags: has a padded laptop compartment (size in measurements.laptop_max_inch)."
        water_resistance:
          type: string
          enum:
            - none
            - water_repellent
            - waterproof
          description: "All: resistance to water as stated by the brand."
        detachable_parts:
          type: array
          items:
            type: string
            enum:
              - shoulder_strap
              - handle
              - lining
              - insole
              - hood
              - belt
              - pouch
              - wheels
          uniqueItems: true
          description: "All: parts that can be removed by the user."
        adjustable_parts:
          type: array
          items:
            type: string
            enum:
              - shoulder_strap
              - waist
              - hem
              - cuff
          uniqueItems: true
          description: "All: parts the user can adjust."
        fit:
          type: string
          enum:
            - slim
            - regular
            - relaxed
            - oversized
          description: "Apparel: fit."
        sleeve_length:
          type: string
          enum:
            - sleeveless
            - short
            - three_quarter
            - long
          description: "Apparel: sleeve length."
        neckline:
          type: string
          enum:
            - crew
            - v_neck
            - collar
            - hood
            - turtleneck
            - boat
            - scoop
          description: "Apparel: neckline."
      propertyNames:
        pattern: ^[a-z][a-z0-9_]{0,63}$
      additionalProperties:
        anyOf:
          - type:
              - string
              - number
              - boolean
          - type: array
            items:
              type:
                - string
                - number
                - boolean
    ProductInput:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: https://openbrandexchange.com/schemas/v0.2/ProductInput.json
      type: object
      title: ProductInput
      description: "Ingest write model for a product. Key: external_id (path); when a brand has no separate product id, use the style number."
      properties:
        brand_external_id:
          anyOf:
            - $ref: "#/components/schemas/ExternalId"
              description: Required unless the node has exactly one brand.
            - type: "null"
        style_number:
          type: string
          minLength: 1
          maxLength: 200
        name:
          $ref: "#/components/schemas/LocalizedText"
        description:
          anyOf:
            - $ref: "#/components/schemas/LocalizedText"
            - type: "null"
        item_type:
          type:
            - string
            - "null"
          pattern: ^[a-z][a-z0-9_]{0,63}$
        item_subtype:
          type:
            - string
            - "null"
          pattern: ^[a-z][a-z0-9_]{0,63}$
        gpc_brick:
          type:
            - string
            - "null"
          pattern: ^[0-9]{8}$
        target_group:
          type:
            - string
            - "null"
          pattern: ^[a-z][a-z0-9_]{0,63}$
        season:
          type:
            - string
            - "null"
          maxLength: 64
        collection:
          type:
            - string
            - "null"
          maxLength: 200
        materials:
          anyOf:
            - $ref: "#/components/schemas/Materials"
            - type: "null"
        contains_animal_origin:
          type:
            - boolean
            - "null"
        footwear_materials:
          anyOf:
            - $ref: "#/components/schemas/FootwearMaterials"
            - type: "null"
        care:
          anyOf:
            - $ref: "#/components/schemas/Care"
            - type: "null"
        country_of_origin:
          anyOf:
            - $ref: "#/components/schemas/CountryCode"
            - type: "null"
        certifications:
          anyOf:
            - $ref: "#/components/schemas/Certifications"
            - type: "null"
        dpp_url:
          anyOf:
            - $ref: "#/components/schemas/Url"
            - type: "null"
        features:
          anyOf:
            - $ref: "#/components/schemas/Features"
            - type: "null"
        attributes:
          type:
            - object
            - "null"
          propertyNames:
            pattern: ^[a-z][a-z0-9_]{0,63}$
          additionalProperties:
            anyOf:
              - type:
                  - string
                  - number
                  - boolean
              - $ref: "#/components/schemas/LocalizedText"
        status:
          $ref: "#/components/schemas/PublicationStatus"
      required:
        - style_number
        - name
      additionalProperties: false
      patternProperties:
        ^x-[a-z0-9]+-[a-z0-9_-]+$: true
    GtinInput:
      type: string
      description: "A GTIN as supplied: GTIN-8, UPC-A (12), EAN-13 or GTIN-14 digits."
      pattern: ^([0-9]{8}|[0-9]{12,14})$
      examples:
        - "2000010010011"
    Color:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: https://openbrandexchange.com/schemas/v0.2/Color.json
      type: object
      title: Color
      properties:
        code:
          type: string
          description: The brand's colour code, stable key (e.g. 'NVY', '001').
          minLength: 1
          maxLength: 64
        name:
          anyOf:
            - $ref: "#/components/schemas/LocalizedText"
            - type: "null"
        supplier_color:
          type:
            - string
            - "null"
          description: Colour name as used in the brand's own systems/labels.
          maxLength: 200
        family:
          anyOf:
            - type: string
              enum:
                - black
                - white
                - grey
                - beige
                - brown
                - red
                - pink
                - orange
                - yellow
                - green
                - blue
                - purple
                - gold
                - silver
                - multicolour
                - transparent
              description: Colour family for filters, next to the brand's own colour name. The same for every variant of one colour code.
            - type: "null"
      required:
        - code
      additionalProperties: false
      patternProperties:
        ^x-[a-z0-9]+-[a-z0-9_-]+$: true
    Measurements:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: https://openbrandexchange.com/schemas/v0.2/Measurements.json
      title: Measurements
      description: "Measurements of one variant. Numbers only; the unit is part of the key (cm, kg, l, inch). Only the measurements the brand stated are present; null instead of an empty object. How to measure: docs/protocol.md#measurements."
      type: object
      properties:
        height_cm:
          type: number
          exclusiveMinimum: 0
          description: "Vertical, the article standing in normal use. Luggage: outer dimension including wheels, handles and feet. Bags: the body without handles and strap."
        width_cm:
          type: number
          exclusiveMinimum: 0
          description: "Left to right, seen from the front. Luggage: outer dimension including wheels, handles and feet. Bags: the body."
        depth_cm:
          type: number
          exclusiveMinimum: 0
          description: "Front to back. Luggage: outer dimension including wheels, handles and feet. Bags: the body."
        weight_kg:
          type: number
          exclusiveMinimum: 0
          description: Weight of the article itself, without packaging.
        volume_l:
          type: number
          exclusiveMinimum: 0
          description: Volume in litres (luggage, bags).
        volume_expanded_l:
          type: number
          exclusiveMinimum: 0
          description: Volume in litres when expanded (luggage and bags with an expansion zip).
        handle_drop_cm:
          type: number
          exclusiveMinimum: 0
          description: "Bags: from the top of the handle to the top of the body, handle held upright."
        strap_length_cm:
          type: object
          description: "Bags: length of the shoulder strap, shortest and longest setting (equal when not adjustable)."
          properties:
            min:
              type: number
              exclusiveMinimum: 0
              description: Shortest setting.
            max:
              type: number
              exclusiveMinimum: 0
              description: Longest setting.
          required:
            - min
            - max
          additionalProperties: false
        laptop_max_inch:
          type: number
          exclusiveMinimum: 0
          description: Largest laptop (screen diagonal in inches) the laptop compartment takes.
        heel_height_cm:
          type: number
          exclusiveMinimum: 0
          description: "Footwear: height of the heel at the back, measured from the floor."
        shaft_height_cm:
          type: number
          exclusiveMinimum: 0
          description: "Footwear (boots): height of the shaft, from the top of the insole at the heel to the top of the shaft."
        inseam_cm:
          type: number
          exclusiveMinimum: 0
          description: "Trousers: inside leg length, from the crotch seam to the hem."
      additionalProperties: false
      patternProperties:
        ^x-[a-z0-9]+-[a-z0-9_-]+$: true
    VariantInput:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: https://openbrandexchange.com/schemas/v0.2/VariantInput.json
      type: object
      title: VariantInput
      description: "Ingest write model for a variant. Key: external_id (path); default convention = the GTIN, else `<style>-<color>-<size>`."
      properties:
        product_external_id:
          $ref: "#/components/schemas/ExternalId"
        gtin:
          anyOf:
            - $ref: "#/components/schemas/GtinInput"
              description: Check digit MUST be valid (invalid_gtin). Unique within the node (gtin_conflict).
            - type: "null"
        sku:
          type:
            - string
            - "null"
          maxLength: 200
        color:
          $ref: "#/components/schemas/Color"
        size:
          type:
            - string
            - "null"
          maxLength: 64
        size_length:
          type:
            - string
            - "null"
          maxLength: 64
        size_system:
          type:
            - string
            - "null"
          maxLength: 16
        measurements:
          anyOf:
            - $ref: "#/components/schemas/Measurements"
            - type: "null"
        status:
          $ref: "#/components/schemas/PublicationStatus"
      required:
        - product_external_id
        - color
      additionalProperties: false
      patternProperties:
        ^x-[a-z0-9]+-[a-z0-9_-]+$: true
    Role:
      type: string
      enum:
        - packshot
        - model
        - detail
        - ghost
        - flatlay
        - scene
        - swatch
        - size_chart
        - other
      description: What the image shows. Stable key; labels are presentation.
    View:
      type: string
      enum:
        - front
        - back
        - side
        - left
        - right
        - top
        - bottom
        - tilted_left
        - tilted_right
        - inside
        - detail
        - other
      description: Viewing angle. Aligned with Fashion Cloud product_view plus 'inside'.
    Channel:
      type: string
      enum:
        - webshop
        - marketplace
        - social
        - print
      description: Sales/marketing channel a rights grant covers.
    Sha256:
      type: string
      description: Lowercase hex SHA-256 of the exact bytes.
      pattern: ^[a-f0-9]{64}$
    AssetInput:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: https://openbrandexchange.com/schemas/v0.2/AssetInput.json
      type: object
      title: AssetInput
      description: "Ingest write model for an asset. Key: external_id (path); filename-pattern convention = `<style>_<color>_<position>`."
      properties:
        product_external_id:
          $ref: "#/components/schemas/ExternalId"
        color_code:
          type:
            - string
            - "null"
          maxLength: 64
        variant_external_ids:
          type:
            - array
            - "null"
          items:
            $ref: "#/components/schemas/ExternalId"
        media_type:
          type: string
          enum:
            - image
        role:
          $ref: "#/components/schemas/Role"
        view:
          anyOf:
            - $ref: "#/components/schemas/View"
            - type: "null"
        position:
          type: integer
          minimum: 1
          maximum: 999
        filename:
          type:
            - string
            - "null"
          description: Download filename; default `<external_id>.<ext>`.
          maxLength: 255
        alt_text:
          anyOf:
            - $ref: "#/components/schemas/LocalizedText"
            - type: "null"
        rights:
          type:
            - object
            - "null"
          properties:
            license:
              type: string
              enum:
                - retailer-use
                - custom
            license_text:
              type:
                - string
                - "null"
              maxLength: 20000
            channels:
              type: array
              items:
                $ref: "#/components/schemas/Channel"
              uniqueItems: true
            territories:
              type:
                - array
                - "null"
              items:
                $ref: "#/components/schemas/CountryCode"
              uniqueItems: true
            embargo_until:
              anyOf:
                - $ref: "#/components/schemas/DateTime"
                - type: "null"
            expires_at:
              anyOf:
                - $ref: "#/components/schemas/DateTime"
                - type: "null"
            credit:
              type:
                - string
                - "null"
              maxLength: 500
            model_release:
              type:
                - boolean
                - "null"
          additionalProperties: false
          patternProperties:
            ^x-[a-z0-9]+-[a-z0-9_-]+$: true
          description: Partial Rights; omitted fields take the node's default rights (Settings). null = all defaults.
        provenance:
          type:
            - object
            - "null"
          properties:
            ai_generated:
              type: boolean
            ai_edited:
              type: boolean
            source:
              type: string
              enum:
                - photo
                - generated
                - composite
            c2pa:
              type: string
              enum:
                - embedded
                - sidecar
                - none
            c2pa_manifest_url:
              anyOf:
                - $ref: "#/components/schemas/Url"
                - type: "null"
            generator:
              type:
                - string
                - "null"
              maxLength: 200
          additionalProperties: false
          patternProperties:
            ^x-[a-z0-9]+-[a-z0-9_-]+$: true
          description: Omitted fields default to ai_generated=false, ai_edited=false, source=photo (generated when ai_generated), c2pa=none (nodes MAY detect embedded C2PA).
        files:
          type:
            - object
            - "null"
          description: Attach previously uploaded blobs atomically. Omit to keep current files (or upload via PUT .../files/{rendition}).
          properties:
            original:
              type: object
              description: Reference to an uploaded blob. width/height are required for client-generated renditions and for originals whose type the node cannot parse (e.g. TIFF).
              properties:
                sha256:
                  $ref: "#/components/schemas/Sha256"
                width:
                  type:
                    - integer
                    - "null"
                  minimum: 1
                height:
                  type:
                    - integer
                    - "null"
                  minimum: 1
              required:
                - sha256
              additionalProperties: false
              patternProperties:
                ^x-[a-z0-9]+-[a-z0-9_-]+$: true
            web:
              type: object
              description: Reference to an uploaded blob. width/height are required for client-generated renditions and for originals whose type the node cannot parse (e.g. TIFF).
              properties:
                sha256:
                  $ref: "#/components/schemas/Sha256"
                width:
                  type:
                    - integer
                    - "null"
                  minimum: 1
                height:
                  type:
                    - integer
                    - "null"
                  minimum: 1
              required:
                - sha256
              additionalProperties: false
              patternProperties:
                ^x-[a-z0-9]+-[a-z0-9_-]+$: true
            square:
              type: object
              description: Reference to an uploaded blob. width/height are required for client-generated renditions and for originals whose type the node cannot parse (e.g. TIFF).
              properties:
                sha256:
                  $ref: "#/components/schemas/Sha256"
                width:
                  type:
                    - integer
                    - "null"
                  minimum: 1
                height:
                  type:
                    - integer
                    - "null"
                  minimum: 1
              required:
                - sha256
              additionalProperties: false
              patternProperties:
                ^x-[a-z0-9]+-[a-z0-9_-]+$: true
            thumb:
              type: object
              description: Reference to an uploaded blob. width/height are required for client-generated renditions and for originals whose type the node cannot parse (e.g. TIFF).
              properties:
                sha256:
                  $ref: "#/components/schemas/Sha256"
                width:
                  type:
                    - integer
                    - "null"
                  minimum: 1
                height:
                  type:
                    - integer
                    - "null"
                  minimum: 1
              required:
                - sha256
              additionalProperties: false
              patternProperties:
                ^x-[a-z0-9]+-[a-z0-9_-]+$: true
          additionalProperties: false
          patternProperties:
            ^x-[a-z0-9]+-[a-z0-9_-]+$: true
        status:
          $ref: "#/components/schemas/PublicationStatus"
      required:
        - product_external_id
        - role
        - position
      additionalProperties: false
      patternProperties:
        ^x-[a-z0-9]+-[a-z0-9_-]+$: true
    Blob:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: https://openbrandexchange.com/schemas/v0.2/Blob.json
      type: object
      title: Blob
      properties:
        sha256:
          $ref: "#/components/schemas/Sha256"
        bytes:
          type: integer
          minimum: 1
        content_type:
          type: string
        width:
          type:
            - integer
            - "null"
          minimum: 1
        height:
          type:
            - integer
            - "null"
          minimum: 1
        created:
          type: boolean
          description: false when the node already had these bytes (dedupe).
      required:
        - sha256
        - bytes
        - content_type
        - created
      additionalProperties: false
      patternProperties:
        ^x-[a-z0-9]+-[a-z0-9_-]+$: true
    Upload:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: https://openbrandexchange.com/schemas/v0.2/Upload.json
      type: object
      title: Upload
      properties:
        id:
          $ref: "#/components/schemas/Id"
        sha256:
          $ref: "#/components/schemas/Sha256"
        bytes:
          type: integer
          minimum: 1
        content_type:
          type: string
        part_bytes:
          type: integer
          description: Every part except the last MUST be exactly this size (>= 5 MiB).
          minimum: 5242880
        parts_total:
          type: integer
          minimum: 1
        received_parts:
          type: array
          items:
            type: integer
            minimum: 1
          description: Part numbers already stored (resume by sending the others).
        status:
          type: string
          enum:
            - open
            - completed
            - aborted
            - expired
        expires_at:
          $ref: "#/components/schemas/DateTime"
      required:
        - id
        - sha256
        - bytes
        - content_type
        - part_bytes
        - parts_total
        - received_parts
        - status
        - expires_at
      additionalProperties: false
      patternProperties:
        ^x-[a-z0-9]+-[a-z0-9_-]+$: true
    IngestOperation:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: https://openbrandexchange.com/schemas/v0.2/IngestOperation.json
      type: object
      title: IngestOperation
      description: One operation of POST /obx/v1/ingest/batch (JSON array element or NDJSON line).
      properties:
        op:
          type: string
          enum:
            - upsert
            - patch
            - delete
            - publish
            - unpublish
          description: upsert = PUT (create or replace); patch = JSON merge patch; publish/unpublish = patch of status.
        kind:
          type: string
          enum:
            - brand
            - product
            - variant
            - asset
        external_id:
          $ref: "#/components/schemas/ExternalId"
        data:
          type: object
          description: "upsert: BrandInput|ProductInput|VariantInput|AssetInput by kind. patch: merge patch of that. Absent for delete/publish/unpublish."
        if_match:
          type:
            - string
            - "null"
          description: Optional ETag precondition.
      required:
        - op
        - kind
        - external_id
      additionalProperties: false
      patternProperties:
        ^x-[a-z0-9]+-[a-z0-9_-]+$: true
    ImportRowError:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: https://openbrandexchange.com/schemas/v0.2/ImportRowError.json
      type: object
      title: ImportRowError
      properties:
        file:
          type: string
          description: products.csv, assets.csv, products.xlsx, assets.xlsx (Excel import, a node feature) or the image file name.
          maxLength: 255
        row:
          type:
            - integer
            - "null"
          description: 1-based data row; for a workbook (products.xlsx, assets.xlsx) the Excel row number, header = row 1. null for header, file-level and image-file problems.
          minimum: 1
        column:
          type:
            - string
            - "null"
          maxLength: 100
        severity:
          type: string
          enum:
            - error
            - warning
          description: "error: row/file skipped. warning: imported, with a correction or a label completeness warning."
        obx_error:
          anyOf:
            - $ref: "#/components/schemas/ErrorCode"
            - $ref: "#/components/schemas/WarningCode"
          description: An error code, or for severity warning also a label completeness warning code.
        detail:
          type: string
          maxLength: 2000
        value:
          type:
            - string
            - "null"
          maxLength: 500
      required:
        - file
        - row
        - severity
        - obx_error
        - detail
      additionalProperties: false
      patternProperties:
        ^x-[a-z0-9]+-[a-z0-9_-]+$: true
    ImportRun:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: https://openbrandexchange.com/schemas/v0.2/ImportRun.json
      type: object
      title: ImportRun
      properties:
        id:
          $ref: "#/components/schemas/Id"
        source_id:
          anyOf:
            - $ref: "#/components/schemas/Id"
              description: ImportSource for scheduled/pull runs; null for uploads.
            - type: "null"
        trigger:
          type: string
          enum:
            - upload
            - api
            - schedule
            - manual_run
            - cli
        status:
          type: string
          enum:
            - queued
            - running
            - succeeded
            - failed
          description: succeeded may still contain row errors (see counts.errors).
        mode:
          type: string
          enum:
            - upsert
            - mirror
        dry_run:
          type: boolean
        created_at:
          $ref: "#/components/schemas/DateTime"
        started_at:
          anyOf:
            - $ref: "#/components/schemas/DateTime"
            - type: "null"
        finished_at:
          anyOf:
            - $ref: "#/components/schemas/DateTime"
            - type: "null"
        files:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
                maxLength: 1024
              bytes:
                type: integer
                minimum: 0
              sha256:
                anyOf:
                  - $ref: "#/components/schemas/Sha256"
                  - type: "null"
            required:
              - name
              - bytes
            additionalProperties: false
            patternProperties:
              ^x-[a-z0-9]+-[a-z0-9_-]+$: true
        counts:
          type: object
          properties:
            rows:
              type: integer
              minimum: 0
            files:
              type: integer
              minimum: 0
            created:
              type: integer
              minimum: 0
            updated:
              type: integer
              minimum: 0
            unchanged:
              type: integer
              minimum: 0
            unpublished:
              type: integer
              minimum: 0
            errors:
              type: integer
              minimum: 0
            warnings:
              type: integer
              minimum: 0
          required:
            - rows
            - files
            - created
            - updated
            - unchanged
            - unpublished
            - errors
            - warnings
          additionalProperties: false
          patternProperties:
            ^x-[a-z0-9]+-[a-z0-9_-]+$: true
        error:
          anyOf:
            - $ref: "#/components/schemas/Problem"
            - type: "null"
        errors_preview:
          type: array
          items:
            $ref: "#/components/schemas/ImportRowError"
          description: First <= 50 errors; page through the full list via the errors endpoint.
          maxItems: 50
      required:
        - id
        - source_id
        - trigger
        - status
        - mode
        - dry_run
        - created_at
        - counts
      additionalProperties: false
      patternProperties:
        ^x-[a-z0-9]+-[a-z0-9_-]+$: true
    IngestJob:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: https://openbrandexchange.com/schemas/v0.2/IngestJob.json
      type: object
      title: IngestJob
      properties:
        id:
          $ref: "#/components/schemas/Id"
        kind:
          type: string
          enum:
            - batch
            - import
        status:
          type: string
          enum:
            - queued
            - running
            - succeeded
            - failed
        created_at:
          $ref: "#/components/schemas/DateTime"
        finished_at:
          anyOf:
            - $ref: "#/components/schemas/DateTime"
            - type: "null"
        progress:
          type: object
          properties:
            done:
              type: integer
              minimum: 0
            total:
              type:
                - integer
                - "null"
              minimum: 0
          required:
            - done
            - total
          additionalProperties: false
          patternProperties:
            ^x-[a-z0-9]+-[a-z0-9_-]+$: true
        summary:
          type:
            - object
            - "null"
          properties:
            created:
              type: integer
              minimum: 0
            updated:
              type: integer
              minimum: 0
            unchanged:
              type: integer
              minimum: 0
            deleted:
              type: integer
              minimum: 0
            errors:
              type: integer
              minimum: 0
          required:
            - created
            - updated
            - unchanged
            - deleted
            - errors
          additionalProperties: false
          patternProperties:
            ^x-[a-z0-9]+-[a-z0-9_-]+$: true
        import_run:
          anyOf:
            - $ref: "#/components/schemas/ImportRun"
            - type: "null"
        results_url:
          $ref: "#/components/schemas/Url"
      required:
        - id
        - kind
        - status
        - created_at
        - progress
        - results_url
      additionalProperties: false
      patternProperties:
        ^x-[a-z0-9]+-[a-z0-9_-]+$: true
    Cursor:
      type: string
      description: Opaque pagination or feed cursor. Clients MUST NOT parse or construct it.
      minLength: 1
      maxLength: 4096
  responses:
    Record:
      description: The stored record.
      headers:
        ETag:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/IngestRecord"
          examples:
            asset:
              summary: An image record with defaults applied
              value:
                kind: asset
                id: ast_1
                external_id: KO-1001_NVY_1
                status: published
                visibility: pending_files
                etag: '"c3d4"'
                created_at: 2026-09-28T10:00:00Z
                updated_at: 2026-09-28T10:00:00Z
                data:
                  product_external_id: KO-1001
                  color_code: NVY
                  role: packshot
                  view: front
                  position: 1
                  files:
                    original:
                      sha256: "2222222222222222222222222222222222222222222222222222222222222222"
                      width: 1200
                      height: 1500
                missing_files:
                  - web
                  - square
                  - thumb
    Result:
      description: Operation result (updated, unchanged or deleted).
      headers:
        ETag:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/IngestResult"
          examples:
            unchanged:
              summary: Unchanged (no change entry is written)
              value:
                index: 0
                op: upsert
                kind: product
                external_id: KO-1001
                result: unchanged
                id: prd_1
                visibility: visible
                etag: '"a1b2"'
                error: null
                warnings: []
    ResultCreated:
      description: Created.
      headers:
        ETag:
          schema:
            type: string
        Location:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/IngestResult"
          examples:
            created:
              summary: Created
              value:
                index: 0
                op: upsert
                kind: product
                external_id: KO-1001
                result: created
                id: prd_1
                visibility: visible
                etag: '"a1b2"'
                error: null
                warnings: []
    BadRequest:
      description: "`invalid_request` (malformed JSON/NDJSON/multipart) or `limit_exceeded`."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: "`unauthorized`, `invalid_token` or `access_revoked` (token revoked or expired)."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: "`insufficient_scope` or `forbidden` (brand outside the token restriction)."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: "`not_found`."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: "`conflict`, `gtin_conflict`, `position_conflict` or `upload_incomplete`."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    PreconditionFailed:
      description: "`precondition_failed` (If-Match did not match)."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    PayloadTooLarge:
      description: "`payload_too_large`."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    UnsupportedMediaType:
      description: "`unsupported_media_type`."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ValidationFailed:
      description: "`validation_failed`, `invalid_gtin`, `unknown_parent`, `blob_missing`, `checksum_mismatch` or `files_missing`."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            validation:
              summary: Field errors
              value:
                type: https://openbrandexchange.com/errors/validation_failed
                title: Validation failed
                status: 422
                detail: null
                instance: /obx/v1/ingest/variants/bad-gtin
                obx_error: validation_failed
                errors:
                  - pointer: /gtin
                    obx_error: invalid_gtin
                    detail: Check digit should be 8.
    TooManyRequests:
      description: "`rate_limited`."
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
