                    status: succeeded
                    created_at: 2026-09-28T10:00:00Z
                    finished_at: 2026-09-28T10:00:00Z
                    progress:
                      done: 67
                      total: 67
                    summary:
                      created: 75
                      updated: 0
                      unchanged: 0
                      deleted: 0
                      errors: 1
                    import_run:
                      id: run_1
