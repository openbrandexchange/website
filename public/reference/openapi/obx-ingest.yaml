  /jobs/{id}/results:
    get:
      tags:
        - Jobs
      operationId: listIngestJobResults
      summary: Per-operation (batch) or per-row (import) results
      parameters:
        - $ref: "#/components/parameters/IdPath"
        - name: errors_only
          in: query
          schema:
            type: boolean
            default: false
        - $ref: "#/components/parameters/Cursor"
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000
