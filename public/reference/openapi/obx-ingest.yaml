                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/IngestJob"
                  next_cursor:
                    oneOf:
                      - $ref: "#/components/schemas/Cursor"
                      - type: "null"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /jobs/{id}:
    get:
      tags:
        - Jobs
      operationId: getIngestJob
      summary: Job status
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: The job.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestJob"
              examples:
                import:
                  summary: Import job
                  value:
                    id: job_1
