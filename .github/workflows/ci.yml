name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: validate, lint, typecheck, build, links, tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      # Node runs Astro, the node:test unit tests and Playwright (engines: node >= 22.18; the
      # runner's default Node is older). Bun installs and runs the scripts.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      # Directory schema + listing rules, oxlint, astro check, build, internal links, unit and output tests
      # (locales complete and on-glossary, brochures present and not stale, built pages).
      - run: bun run check
      - name: Dependency licences
        run: bun run check:licenses
      - name: Dependency audit (what ships)
        run: bun audit --production --audit-level=low
      - name: Dependency audit (build tools, report only)
        run: bun audit --audit-level=high || true
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  e2e:
    name: playwright + axe
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      # Node runs Astro, the node:test unit tests and Playwright (engines: node >= 22.18; the
      # runner's default Node is older). Bun installs and runs the scripts.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  lighthouse:
    name: lighthouse budgets
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      # Node runs Astro, the node:test unit tests and Playwright (engines: node >= 22.18; the
      # runner's default Node is older). Bun installs and runs the scripts.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      # ubuntu-latest ships Google Chrome.
      - run: CHROME_PATH="$(command -v google-chrome)" bun run lighthouse

  directory-reachable:
    name: listed portals answer
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # New or changed directory entries: ask each listed portal for its discovery document.
      - run: bun tools/validate-directory.mjs public/directory.json --fetch
